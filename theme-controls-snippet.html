
<!-- Put this immediately after <body> on every Xtreme AG Apps screen -->
<div class="xag-theme-bar" aria-label="Theme and font controls">
  <span class="xag-theme-label">Theme</span>
  <button class="xag-theme-swatch obsidian" data-theme="obsidian" aria-label="Almond Black" title="Almond Black"></button>
  <button class="xag-theme-swatch light" data-theme="light" aria-label="Clean Light" title="Clean Light"></button>
  <button class="xag-theme-swatch aurora" data-theme="aurora" aria-label="Aurora Mint" title="Aurora Mint"></button>
  <button class="xag-theme-swatch neo" data-theme="neo" aria-label="Neon Pop" title="Neon Pop"></button>
  <button class="xag-theme-swatch sunset" data-theme="sunset" aria-label="Sunset" title="Sunset"></button>
  <button class="xag-theme-swatch ocean" data-theme="ocean" aria-label="Ocean" title="Ocean"></button>
  <button class="xag-theme-swatch lavender" data-theme="lavender" aria-label="Lavender" title="Lavender"></button>
  <button class="xag-theme-swatch candy" data-theme="candy" aria-label="Candy" title="Candy"></button>
  <div class="xag-font-control">
    <button class="xag-font-btn" id="xagZoomOut" aria-label="Decrease text size">A−</button>
    <span class="xag-font-value" id="xagFontValue">100%</span>
    <button class="xag-font-btn" id="xagZoomIn" aria-label="Increase text size">A+</button>
  </div>
</div>
