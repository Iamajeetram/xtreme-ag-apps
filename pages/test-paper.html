<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Paper | Xtreme ExamX</title><script src="../js/theme-init.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5eee8;color:#25171a;font-family:Georgia,'Noto Serif Devanagari',serif}.toolbar{position:sticky;top:0;z-index:5;background:#fffaf5;border-bottom:1px solid #e6d8cc;padding:12px}.toolbar-inner{width:min(900px,94%);margin:auto;display:flex;justify-content:space-between;gap:10px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#d9531e;color:#fff;font-weight:800;cursor:pointer}.paper{width:min(900px,94%);margin:20px auto;background:#fffdf9;padding:34px;box-shadow:0 10px 35px #0001;position:relative;overflow:hidden}.paper:before{content:'XTREME AG APPS';position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-25deg);font:900 75px Arial,sans-serif;letter-spacing:4px;color:rgba(217,83,30,.055);white-space:nowrap;pointer-events:none}.head{text-align:center;border-bottom:2px solid #d9531e;padding-bottom:12px}.head h1{font-size:22px;margin:0 0 5px}.head p{margin:3px;color:#735f5f;font-size:12px}.columns{column-count:2;column-gap:30px;margin-top:20px}.q{break-inside:avoid;margin:0 0 14px;font-size:11px;line-height:1.55}.q b{font-family:Arial,sans-serif}.opts{margin-top:4px;padding-left:13px}.opt{margin:1px 0}.footer{border-top:1px solid #e6d8cc;margin-top:20px;padding-top:8px;text-align:center;color:#8b7777;font:10px Arial,sans-serif}@media(max-width:650px){.paper{padding:20px}.columns{column-count:1}.toolbar-inner{flex-direction:column}.btn{width:100%}}@media print{body{background:#fff}.toolbar{display:none}.paper{width:100%;margin:0;box-shadow:none;padding:15mm}.paper:before{position:fixed}.columns{column-count:2;column-gap:12mm}.q{font-size:9.5pt}.head h1{font-size:16pt}.head p{font-size:9pt}.footer{position:fixed;bottom:5mm;left:0;right:0}}
</style></head><body><div class="toolbar"><div class="toolbar-inner"><button class="btn" onclick="window.print()">⬇ Download / Save as PDF</button><button class="btn" onclick="history.back()">← Back</button></div></div><article class="paper"><div id="app">Preparing paper…</div></article><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const id=new URLSearchParams(location.search).get('test');const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
(async()=>{try{if(!id)throw new Error('Test ID missing.');const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html');return}const {data:t,error:te}=await sb.from('tests').select('id,title,description,time_limit_minutes,is_published').eq('id',id).single();if(te)throw te;if(!t.is_published)throw new Error('This test paper is not published.');const {data:qs,error:qe}=await sb.from('questions').select('id,question_text,sort_order').eq('test_id',id).order('sort_order');if(qe)throw qe;let html=`<div class="head"><h1>${esc(t.title)}</h1><p>${esc(t.description||'Xtreme AG Apps Test Paper')}</p><p>${qs.length} Questions • ${Number(t.time_limit_minutes||0)} Minutes</p></div><div class="columns">`;qs.forEach((q,i)=>{html+=`<div class="q"><b>Q${i+1}. ${q.question_text}</b>`;html+=`<div class="opts" data-q="${q.id}"></div></div>`});html+='</div><div class="footer">XTREME AG APPS • XTREME EXAMX • Keep learning. Keep growing.</div>';app.innerHTML=html;for(const q of qs){const {data:opts,error:oe}=await sb.from('view_options').select('option_text,sort_order').eq('question_id',q.id).order('sort_order');if(oe)throw oe;const box=document.querySelector(`[data-q="${q.id}"]`);if(box)box.innerHTML=(opts||[]).map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${esc(o.option_text)}</div>`).join('')}}catch(e){app.innerHTML=`<div style="padding:30px;color:#a33724">${esc(e.message||'Unable to generate paper.')}</div>`}})();
</script></body></html>
