<script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');
const qs=new URLSearchParams(location.search),testId=qs.get('test'),restartRequested=qs.get('restart')==='1';
let questions=[],answers=new Map(),idx=0,attemptId=null,deadline=0,timerId=null,admin=false,activeTest=false,submitting=false,pausing=false;
let review=new Set(),bookmarks=new Set();
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function err(m){$('error').innerHTML='<div class="error">'+esc(m)+'</div>';$('loading').style.display='none'}
function markKey(){return attemptId?'xag-test-marks:'+attemptId:'xag-test-marks:'+testId}
function loadMarks(){try{const x=JSON.parse(localStorage.getItem(markKey())||'{}');review=new Set(x.review||[]);bookmarks=new Set(x.bookmarks||[])}catch{}}
function saveMarks(){localStorage.setItem(markKey(),JSON.stringify({review:[...review],bookmarks:[...bookmarks]}))}
function typeset(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([$('question'),$('options')]).catch(()=>{});}
async function start(){try{
 if(!testId)throw new Error('Test ID missing.');
 const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session){location.href='login.html';return}
 const {data:p,error:pe}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(pe)throw pe;admin=p?.is_admin===true;
 let st,xe;if(restartRequested){const r=await sb.rpc('restart_test',{_test_id:testId});st=r.data;xe=r.error}else{const r=await sb.rpc('start_test',{_test_id:testId});st=r.data;xe=r.error}if(xe)throw xe;if(!st?.id)throw new Error('Could not start the attempt.');
 attemptId=st.id;$('testTitle').textContent=st.title||'Test';$('testSub').textContent='Xtreme ExamX • '+(st.time_limit_minutes||0)+' minutes';
 questions=(st.questions||[]).sort((a,b)=>(a.sort_order??0)-(b.sort_order??0));(st.answers||[]).forEach(a=>answers.set(a.question_id,a.chosen_option_id||a.text_answer||''));
 idx=Math.min(Math.max(Number(st.current_question||0),0),Math.max(questions.length-1,0));loadMarks();
 const startedMs=Date.parse(st.started_at),mins=Number(st.time_limit_minutes||0);deadline=(Number.isFinite(startedMs)?startedMs:Date.now())+mins*60000;
 if(!questions.length)throw new Error('This test has no questions.');
 $('loading').style.display='none';setResponsiveShell();renderPalette();renderQuestion();$('answered').textContent=answers.size+' answered';activeTest=true;window.addEventListener('beforeunload',beforeUnload);history.replaceState({xagTest:true},'',location.pathname+'?test='+encodeURIComponent(testId));startTimer();
 }catch(e){console.error(e);err(e.message||'Unable to start test.')}}
function beforeUnload(e){if(activeTest&&!submitting&&!pausing){e.preventDefault();e.returnValue='Are you sure you want to leave this test? Use Pause to return safely to the portal.';return e.returnValue}}
window.addEventListener('popstate',async()=>{if(activeTest&&!submitting&&!pausing){const leave=confirm('Pause this test and return to the Test Portal? Your time will stop and your question will be saved.');if(leave)await pauseTest(false);else history.pushState({xagTest:true},'',location.href)}});
function setResponsiveShell(){const mobile=window.matchMedia('(max-width:760px)').matches;$('app').style.display=mobile?'block':'grid';$('mobileNav').style.display=mobile?'grid':'none'}
window.addEventListener('resize',()=>{if($('app').style.display!=='none'&&!submitting)setResponsiveShell()});
function startTimer(){clearInterval(timerId);tick();timerId=setInterval(tick,1000)}
function tick(){if(submitting||pausing)return;const left=Math.max(0,deadline-Date.now());const s=Math.floor(left/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;$('timer').textContent=[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':');$('timer').classList.toggle('warning',left<=15*60000&&left>5*60000);$('timer').classList.toggle('danger',left<=5*60000);if(left<=0){clearInterval(timerId);submit(true)}}
function paletteButtons(){return questions.map((q,i)=>'<button class="qn '+(i===idx?'active ':'')+(answers.has(q.id)?'done ':'')+(review.has(q.id)?'review ':'')+(bookmarks.has(q.id)?'bookmark':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>').join('')}
function renderPalette(){$('palette').innerHTML=paletteButtons();$('mobilePalette').innerHTML=paletteButtons()}
async function save(q,opt){answers.set(q.id,opt);$('answered').textContent=answers.size+' answered';renderPalette();const {error}=await sb.from('attempt_answers').upsert({attempt_id:attemptId,question_id:q.id,chosen_option_id:opt,text_answer:null},{onConflict:'attempt_id,question_id'});if(error)throw error}
let posTimer=null;function savePosition(){clearTimeout(posTimer);posTimer=setTimeout(()=>{sb.rpc('update_attempt_position',{_attempt_id:attemptId,_current_question:idx}).then(({error})=>{if(error)console.warn(error)});},120)}
function updateMarkButtons(){const r=review.has(questions[idx].id),b=bookmarks.has(questions[idx].id);$('reviewBtn').textContent=r?'⚑ Review Marked':'⚑ Mark for Review';$('bookmarkBtn').textContent=b?'🔖 Bookmarked':'🔖 Bookmark';$('reviewBtn').classList.toggle('marked',r);$('bookmarkBtn').classList.toggle('marked',b)}
function normalizeMathText(v){return String(v??'').replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,'\\frac{$1}{$2}')}
function renderQuestion(){if(!questions.length)return;const q=questions[idx];$('qcount').textContent='Question '+(idx+1)+' of '+questions.length;$('progress').style.width=((idx+1)/questions.length*100)+'%';$('question').innerHTML=normalizeMathText(q.question_text||'');const opts=q.options||[];$('options').innerHTML=opts.map(o=>'<label class="opt"><input type="radio" name="option" value="'+esc(o.id)+'" '+(answers.get(q.id)===o.id?'checked':'')+'> <span>'+normalizeMathText(o.option_text||'')+'</span></label>').join('');document.querySelectorAll('input[name=option]').forEach(r=>r.addEventListener('change',async e=>{try{await save(q,e.target.value)}catch(x){err(x.message)}}));$('prev').disabled=idx===0;$('next').textContent=idx===questions.length-1?'Last Question':'Next →';$('mPrev').disabled=idx===0;$('mNext').textContent=idx===questions.length-1?'Last Question':'Next →';updateMarkButtons();typeset()}
function jump(i){idx=i;renderPalette();renderQuestion();savePosition();window.scrollTo({top:0,behavior:'smooth'});closePalette()}
function closePalette(){$('paletteSheet').classList.remove('open')}
$('reviewBtn').onclick=()=>{const id=questions[idx].id;review.has(id)?review.delete(id):review.add(id);saveMarks();renderPalette();updateMarkButtons()};$('bookmarkBtn').onclick=()=>{const id=questions[idx].id;bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);saveMarks();renderPalette();updateMarkButtons()};$('prev').onclick=()=>{if(idx>0)jump(idx-1)};$('next').onclick=()=>{if(idx<questions.length-1)jump(idx+1)};
$('mPrev').onclick=()=>{if(idx>0)jump(idx-1)};$('mNext').onclick=()=>{if(idx<questions.length-1)jump(idx+1)};$('mPalette').onclick=()=>{$('paletteSheet').classList.add('open')};$('closePalette').onclick=closePalette;$('paletteSheet').addEventListener('click',e=>{if(e.target===$('paletteSheet'))closePalette()});
$('submit').onclick=()=>submit(false);$('mSubmit').onclick=()=>submit(false);$('paperBtn').onclick=()=>window.open('test-paper.html?test='+encodeURIComponent(testId),'_blank','noopener');$('pauseTop').onclick=()=>pauseTest(true);$('pauseBtn').onclick=()=>pauseTest(true);
async function pauseTest(ask){if(pausing||submitting)return;if(ask&&!confirm('Pause this test? Your time will stop now and you can resume later from the same question.'))return;pausing=true;$('pauseTop').disabled=true;$('pauseBtn').disabled=true;clearInterval(timerId);clearTimeout(posTimer);try{await sb.rpc('update_attempt_position',{_attempt_id:attemptId,_current_question:idx});const {error}=await sb.rpc('pause_attempt',{_attempt_id:attemptId,_current_question:idx});if(error)throw error;activeTest=false;window.removeEventListener('beforeunload',beforeUnload);location.replace('test-series.html')}catch(e){pausing=false;$('pauseTop').disabled=false;$('pauseBtn').disabled=false;startTimer();err(e.message||'Unable to pause test.')}}
async function submit(auto){if(submitting||pausing)return;if(!auto&&!confirm('Submit this test now? You cannot change answers after submission.'))return;submitting=true;$('submit').disabled=true;$('mSubmit').disabled=true;activeTest=false;window.removeEventListener('beforeunload',beforeUnload);clearInterval(timerId);saveMarks();try{const {error}=await sb.rpc('submit_test',{_attempt_id:attemptId});if(error)throw error;closePalette();await showResult()}catch(e){submitting=false;activeTest=true;window.addEventListener('beforeunload',beforeUnload);$('submit').disabled=false;$('mSubmit').disabled=false;err(e.message||'Submit failed')}}
async function showResult(){const {data,error}=await sb.rpc('get_test_result',{_attempt_id:attemptId});if(error)throw error;const r=Array.isArray(data)?data[0]:data,items=r.items||[],total=items.length,attempted=items.filter(x=>x.selected_option_id&&x.selected_option_text!=='अनुत्तरित प्रश्न').length,unanswered=items.filter(x=>!x.selected_option_id||x.is_unanswered).length,correct=items.filter(x=>x.is_correct).length,wrong=items.filter(x=>x.selected_option_id&&!x.is_unanswered&&!x.is_correct).length,score=items.reduce((a,x)=>a+Number(x.marks||0),0),accuracy=attempted?(correct/attempted)*100:0,saved=JSON.parse(localStorage.getItem(markKey())||'{}'),reviewed=new Set(saved.review||[]),booked=new Set(saved.bookmarks||[]);$('mobileNav').style.display='none';$('app').innerHTML='<section class="card result"><h1>Test Submitted 🎉</h1><div class="score">'+score.toFixed(2)+'</div><p class="sub">Detailed performance analysis</p><div class="result-grid"><div class="result-stat">Correct<b>'+correct+'</b></div><div class="result-stat">Wrong<b>'+wrong+'</b></div><div class="result-stat">Unattempted<b>'+unanswered+'</b></div><div class="result-stat">Accuracy<b>'+accuracy.toFixed(1)+'%</b></div></div><div class="analysis-tools" id="analysisTools"><button class="active" data-filter="all">All ('+total+')</button><button data-filter="correct">Correct ('+correct+')</button><button data-filter="wrong">Wrong ('+wrong+')</button><button data-filter="unanswered">Unattempted ('+unanswered+')</button><button data-filter="review">Review ('+items.filter(x=>reviewed.has(x.question_id)).length+')</button><button data-filter="bookmark">Bookmark ('+items.filter(x=>booked.has(x.question_id)).length+')</button></div><div class="analysis-list" id="analysisList"></div><div class="result-actions"><a class="btn" href="test-series.html">Back to Test Series</a></div></section>';function render(f){const list=items.filter(x=>f==='all'||(f==='correct'&&x.is_correct)||(f==='wrong'&&x.selected_option_id&&!x.is_unanswered&&!x.is_correct)||(f==='unanswered'&&(!x.selected_option_id||x.is_unanswered))||(f==='review'&&reviewed.has(x.question_id))||(f==='bookmark'&&booked.has(x.question_id)));$('analysisList').innerHTML=list.map(x=>{const u=!x.selected_option_id||x.is_unanswered,cls=x.is_correct?'correct':u?'unanswered':'wrong',status=x.is_correct?'CORRECT':u?'UNATTEMPTED':'WRONG';return '<article class="analysis-item '+cls+'"><div class="analysis-head"><strong>Question '+x.question_no+'</strong><span class="status-pill">'+status+' · '+Number(x.marks||0).toFixed(2)+'</span></div><div class="question" style="margin-top:8px">'+x.question_text+'</div><div class="answer-box"><div class="your"><b>Your answer:</b> '+esc(x.selected_option_text||'उत्तर नहीं दिया')+'</div><div class="correct-answer"><b>Correct answer:</b> '+esc(x.correct_option_text||'—')+'</div></div>'+(x.explanation?'<div class="explanation"><b>Explanation:</b><br>'+x.explanation+'</div>':'')+'</article>'}).join('')||'<p class="sub">No questions in this filter.</p>';typeset()}document.querySelectorAll('#analysisTools button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#analysisTools button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render('all');$('timer').textContent='COMPLETED'}
start();
</script></body></html>
