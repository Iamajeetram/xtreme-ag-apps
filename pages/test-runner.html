<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test | Xtreme ExamX</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/theme-controls.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--black,#FAF5EF);color:var(--white,#2C1A1D);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1050px,94%);margin:auto}header{position:sticky;top:0;z-index:20;background:var(--surface,#FFFBF7);border-bottom:1px solid var(--border);box-shadow:0 5px 20px #0000000a}.bar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:900}.timer{font-variant-numeric:tabular-nums;background:var(--surface-2,#F7EBE1);border:1px solid var(--border);padding:9px 12px;border-radius:10px;font-weight:900}.progress{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold,#D9531E),var(--gold-light,#F2815B))}.layout{display:grid;grid-template-columns:1fr 245px;gap:15px;padding:20px 0 80px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}.qmeta{display:flex;justify-content:space-between;color:var(--gray);font-size:11px;margin-bottom:12px}.question{font-size:18px;line-height:1.7}.question table{max-width:100%;display:block;overflow:auto}.opts{display:grid;gap:10px;margin-top:20px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:13px;border-radius:12px;cursor:pointer;background:var(--surface)}.opt:hover{background:var(--surface-2)}.opt input{margin-top:3px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;background:linear-gradient(135deg,var(--gold,#D9531E),var(--gold-light,#F2815B));color:#fff;padding:11px 15px;border-radius:10px;font-weight:900;cursor:pointer}.btn.secondary{background:var(--surface-2);color:var(--white);border:1px solid var(--border)}.btn.danger{background:#a63a3a}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qn{padding:8px 0;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;font-size:10px}.qn.active{outline:2px solid var(--gold)}.qn.done{background:var(--surface-2)}.side h3{font-size:13px;margin-top:0}.muted{color:var(--gray);font-size:11px;line-height:1.5}.error{color:#9b3030;background:#f8e4e4;border:1px solid #e4b1b1;padding:12px;border-radius:10px;margin:10px 0}.result{text-align:center}.result .score{font-size:44px;font-weight:900;margin:12px}.loading{text-align:center;padding:60px;color:var(--gray)}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:-1}.palette{grid-template-columns:repeat(10,1fr)}}
</style></head><body><header><div class="wrap bar"><div class="title" id="testTitle">Loading…</div><div class="timer" id="timer">--:--:--</div></div><div class="wrap"><div class="progress"><i id="progress"></i></div></div></header><main class="wrap"><div id="error"></div><div id="loading" class="loading">Preparing your test…</div><div id="app" class="layout" style="display:none"><section class="card"><div class="qmeta"><span id="qcount">Question 1</span><span id="answered">0 answered</span></div><div id="question" class="question"></div><div id="options" class="opts"></div><div class="actions"><button class="btn secondary" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div></section><aside class="card side"><h3>Questions</h3><div id="palette" class="palette"></div><p class="muted" style="margin-top:14px">Tap a number to jump. Selected answers are saved automatically.</p><button class="btn danger" id="submit" style="width:100%;margin-top:10px">Submit Test</button></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const qs=new URLSearchParams(location.search);const testId=qs.get('test');let questions=[],answers=new Map(),idx=0,attemptId=null,deadline=0,timerId=null,admin=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function err(m){$('error').innerHTML=`<div class="error">${esc(m)}</div>`;$('loading').style.display='none'}
async function getOptions(q){if(admin){const {data,error}=await sb.from('options').select('id,question_id,option_text,sort_order').eq('question_id',q.id).order('sort_order');if(error)throw error;return data||[]}const {data,error}=await sb.from('view_options').select('id,question_id,option_text,sort_order').eq('question_id',q.id).order('sort_order');if(error)throw error;return data||[]}
async function start(){try{if(!testId)throw new Error('Test ID missing.');const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}const {data:p}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();admin=p?.is_admin===true;let started;const rpc=await sb.rpc('start_test',{_test_id:testId});if(!rpc.error) started=rpc.data;else{const {data:t,error:te}=await sb.from('tests').select('id,title,time_limit_minutes,is_published,test_series_id').eq('id',testId).single();if(te)throw te;const {data:a,error:ae}=await sb.from('attempts').insert({user_id:session.user.id,test_id:testId,status:'in_progress'}).select('id,started_at').single();if(ae)throw new Error(rpc.error.message+' | '+ae.message);started=a}if(Array.isArray(started))started=started[0];attemptId=started?.id||started?.attempt_id;if(!attemptId)throw new Error('Could not start the attempt.');const {data:t,error:te}=await sb.from('tests').select('id,title,time_limit_minutes,is_published,test_series_id').eq('id',testId).single();if(te)throw te;$('testTitle').textContent=t.title;const {data:qsData,error:qe}=await sb.from('questions').select('id,question_text,question_type,points,negative_marks,sort_order').eq('test_id',testId).order('sort_order');if(qe)throw qe;questions=[];for(const q of qsData||[]){questions.push({...q,options:await getOptions(q)})}if(!questions.length)throw new Error('This test has no questions.');const {data:old}=await sb.from('attempt_answers').select('question_id,chosen_option_id,text_answer').eq('attempt_id',attemptId);(old||[]).forEach(a=>answers.set(a.question_id,a.chosen_option_id||a.text_answer||''));const mins=Number(t.time_limit_minutes||0);deadline=Date.now()+mins*60000;renderPalette();renderQuestion();$('loading').style.display='none';$('app').style.display='grid';timerId=setInterval(tick,1000);tick()}catch(e){console.error(e);err(e.message||'Unable to start test.')}}
function tick(){const left=Math.max(0,deadline-Date.now());const s=Math.floor(left/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;$('timer').textContent=[h,m,sec].map((v,i)=>String(v).padStart(i?2:2,'0')).join(':');if(left<=0){clearInterval(timerId);submit(true)}}
function renderPalette(){const p=$('palette');p.innerHTML=questions.map((q,i)=>`<button class="qn ${i===idx?'active':''} ${answers.has(q.id)?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}
async function save(q,opt){answers.set(q.id,opt);const {error}=await sb.from('attempt_answers').upsert({attempt_id:attemptId,question_id:q.id,chosen_option_id:opt,text_answer:null},{onConflict:'attempt_id,question_id'});if(error)throw error;renderPalette();$('answered').textContent=`${answers.size} answered`}
function renderQuestion(){const q=questions[idx];$('qcount').textContent=`Question ${idx+1} of ${questions.length}`;$('progress').style.width=((idx+1)/questions.length*100)+'%';$('question').innerHTML=q.question_text;$('options').innerHTML=q.options.map((o,i)=>`<label class="opt"><input type="radio" name="option" value="${esc(o.id)}" ${answers.get(q.id)===o.id?'checked':''}> <span>${esc(o.option_text)}</span></label>`).join('');document.querySelectorAll('input[name=option]').forEach(r=>r.addEventListener('change',async e=>{try{await save(q,e.target.value)}catch(x){err(x.message)}}));$('prev').disabled=idx===0;$('next').textContent=idx===questions.length-1?'Last Question':'Next →'}
function jump(i){idx=i;renderPalette();renderQuestion()}$('prev').onclick=()=>{if(idx>0){idx--;renderPalette();renderQuestion()}};$('next').onclick=()=>{if(idx<questions.length-1){idx++;renderPalette();renderQuestion()}};$('submit').onclick=()=>submit(false);
async function submit(auto){if(!auto&&!confirm('Submit this test now? You cannot change answers after submission.'))return;try{$('submit').disabled=true;clearInterval(timerId);const {data,error}=await sb.rpc('submit_test',{_attempt_id:attemptId});if(error)throw error;const r=Array.isArray(data)?data[0]:data;$('app').innerHTML=`<section class="card result"><h1>Test Submitted 🎉</h1><div class="score">${Number(r.score||0).toFixed(2)}</div><p class="muted">Correct: ${Number(r.correct||0)} &nbsp; • &nbsp; Wrong: ${Number(r.wrong||0)}</p><a class="btn" href="test-series.html">Back to Test Series</a></section>`;$('timer').textContent='COMPLETED'}catch(e){$('submit').disabled=false;err(e.message||'Submit failed');}}
window.jump=jump;start();
</script></body></html>
