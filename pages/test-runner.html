<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test | Xtreme ExamX</title>
<script src="../js/theme-init.js"></script>
<link rel="stylesheet" href="../css/theme-controls.css">
<style>
:root{--bg:#FAF5EF;--surface:#FFFBF7;--surface2:#F7EBE1;--text:#2C1A1D;--muted:#7A6666;--border:#E6D8CC;--primary:#D9531E;--secondary:#F2815B;--danger:#B23A32;--ok:#3f7c4b;--warn:#b77922}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}button:focus-visible{outline:3px solid rgba(217,83,30,.25);outline-offset:2px}.wrap{width:min(1220px,96%);margin:auto}
.top{position:sticky;top:0;z-index:50;background:rgba(255,251,247,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);box-shadow:0 3px 16px rgba(44,26,29,.06)}
.topbar{min-height:72px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:0 4px}.brand{min-width:0}.title{font-size:18px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:var(--muted);margin-top:4px}.timer{min-width:132px;text-align:center;background:var(--surface2);border:1px solid rgba(217,83,30,.2);padding:11px 14px;border-radius:14px;font-size:18px;font-weight:950;font-variant-numeric:tabular-nums}.timer.warning{color:#9a5b18;background:#fff1dd}.timer.danger{color:#a52f2f;background:#fbe6e4}.progress-wrap{height:5px;background:var(--surface2)}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .2s}
.main{padding:20px 0 80px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 7px 25px rgba(44,26,29,.045)}.question-card{padding:24px;min-height:600px}.qtop{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border)}.qnum{font-size:14px;font-weight:950}.answered{font-size:12px;color:var(--muted)}
.question{font-size:20px;line-height:1.75;margin-top:22px;overflow-wrap:anywhere}.question img{max-width:100%;height:auto}.question table{max-width:100%;display:block;overflow:auto}.opts{display:grid;gap:11px;margin-top:24px}.opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);padding:15px 16px;border-radius:13px;cursor:pointer;background:var(--surface);transition:.15s}.opt:hover{background:var(--surface2);border-color:rgba(217,83,30,.3)}.opt:has(input:checked){background:#fff1e9;border-color:var(--primary);box-shadow:0 0 0 2px rgba(217,83,30,.08)}.opt input{accent-color:var(--primary);margin:4px 0 0;flex:0 0 auto}.opt span{line-height:1.55}
.tools,.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tools{margin-top:22px}.actions{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}.btn{border:0;border-radius:11px;padding:11px 15px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--danger)}.btn.marked{border-color:var(--primary);background:#fff0e8}.btn:disabled{opacity:.5;cursor:not-allowed}.tools .btn{font-size:12px}.actions .btn{min-width:112px}
.side{padding:18px;position:sticky;top:92px;max-height:calc(100vh - 110px);overflow:auto}.side h3{margin:0 0 14px;font-size:15px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qn{height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-weight:850;font-size:12px;cursor:pointer}.qn.active{outline:2px solid var(--primary);outline-offset:1px}.qn.done{background:#f2e6dc}.qn.review{border-color:#d59a45;background:#fff0d8}.qn.bookmark{box-shadow:inset 0 -3px 0 var(--primary)}.legend{font-size:11px;color:var(--muted);line-height:1.7;margin:15px 0}.side .submit{width:100%;margin-top:4px}
.loading{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:16px}.loader-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 34px;box-shadow:0 10px 30px rgba(44,26,29,.05)}.spinner{width:28px;height:28px;border:3px solid var(--surface2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 13px}@keyframes spin{to{transform:rotate(360deg)}}.error{color:#8f2e2e;background:#f9e4e3;border:1px solid #e8b7b4;padding:12px 14px;border-radius:11px;margin-bottom:12px;font-size:13px}
.palette-sheet{display:none}.mobile-nav{display:none}
.result{text-align:center;padding:28px}.score{font-size:48px;font-weight:950}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;text-align:left}.result-stat{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px}.result-stat b{display:block;font-size:20px;margin-top:3px}.analysis-tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.analysis-tools button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.analysis-tools button.active{background:var(--primary);color:#fff}.analysis-list{display:grid;gap:12px;text-align:left}.analysis-item{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--surface)}.analysis-item.correct{border-left:5px solid var(--ok)}.analysis-item.wrong{border-left:5px solid #b04444}.analysis-item.unanswered{border-left:5px solid var(--warn)}.analysis-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.status-pill{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:var(--surface2)}.answer-box{display:grid;gap:6px;margin-top:10px;font-size:13px}.answer-box .your{color:#9b3030}.answer-box .correct-answer{color:#3e7043}.explanation{margin-top:12px;padding:12px;background:var(--surface2);border-radius:10px;line-height:1.6;font-size:13px}.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:1024px){
 .wrap{width:100%}.topbar{min-height:62px;padding:0 12px;gap:10px}.title{font-size:15px}.sub{font-size:10px}.timer{min-width:104px;font-size:15px;padding:9px 9px}.progress-wrap{height:4px}.main{padding:10px 0 78px}.layout{display:block}.question-card{border-radius:0;border-left:0;border-right:0;padding:16px 13px;min-height:0;box-shadow:none}.qtop{padding-bottom:11px}.qnum{font-size:13px}.question{font-size:18px;line-height:1.7;margin-top:17px}.opts{margin-top:18px;gap:9px}.opt{padding:14px 12px;border-radius:12px}.tools{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools .btn{min-width:0;width:100%;padding:10px 8px}.tools #paperBtn{grid-column:1/-1}.actions{display:none}.side{display:none}.mobile-nav{position:fixed;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;left:0;right:0;bottom:0;z-index:60;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(255,251,247,.98);border-top:1px solid var(--border);box-shadow:0 -5px 22px rgba(44,26,29,.1)}.mobile-nav .btn{padding:11px 7px;font-size:13px}.mobile-nav .palette-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.palette-sheet{position:fixed;inset:0;z-index:80;background:rgba(44,26,29,.48);padding:0;display:none;align-items:flex-end}.palette-sheet.open{display:flex}.palette-panel{width:100%;max-height:78vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(44,26,29,.25)}.palette-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.palette-head h3{margin:0;font-size:16px}.close-palette{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:7px 10px;font-weight:900}.mobile-palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.mobile-palette .qn{height:38px}.sheet-submit{width:100%;margin-top:14px}.legend{margin:12px 0}.result{border-radius:0;border-left:0;border-right:0;padding:22px 14px}.result-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:420px){.mobile-palette{grid-template-columns:repeat(7,1fr)}.question{font-size:17px}.timer{min-width:98px}.tools{grid-template-columns:1fr 1fr}}
@media(min-width:1025px){.mobile-bottom{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap topbar"><div class="brand"><div class="title" id="testTitle">Loading test…</div><div class="sub" id="testSub">Xtreme ExamX • Test Portal</div></div><div class="timer" id="timer">--:--:--</div></div><div class="progress-wrap"><div class="progress" id="progress"></div></div></header>
<main class="wrap main"><div id="error"></div><div id="loading" class="loading"><div class="loader-box"><div class="spinner"></div><div id="loadingText">Starting your test…</div></div></div><div id="app" class="layout" style="display:none"><section class="card question-card"><div class="qtop"><span class="qnum" id="qcount">Question 1</span><span class="answered" id="answered">0 answered</span></div><div id="question" class="question"></div><div id="options" class="opts"></div><div class="tools"><button class="btn secondary" id="reviewBtn" type="button">⚑ Mark for Review</button><button class="btn secondary" id="bookmarkBtn" type="button">🔖 Bookmark</button><button class="btn secondary" id="paperBtn" type="button">⬇ Test PDF</button></div><div class="actions"><button class="btn secondary" id="prev" type="button">← Previous</button><button class="btn" id="next" type="button">Next →</button></div></section><aside class="card side"><h3>Question Palette</h3><div id="palette" class="palette"></div><div class="legend">Tap a number to jump.<br>🟨 Review &nbsp; 🔖 Bookmark<br>Answers save automatically.</div><button class="btn danger submit" id="submit" type="button">Submit Test</button></aside></div></main>
<nav class="mobile-nav" id="mobileNav" style="display:none"><button class="btn secondary" id="mPrev" type="button">← Previous</button><button class="btn palette-btn" id="mPalette" type="button">☷ Questions</button><button class="btn" id="mNext" type="button">Next →</button></nav>
<div class="palette-sheet" id="paletteSheet"><div class="palette-panel"><div class="palette-head"><h3>Question Palette</h3><button class="close-palette" id="closePalette" type="button">Close</button></div><div id="mobilePalette" class="mobile-palette"></div><div class="legend">🟨 Review &nbsp; 🔖 Bookmark<br>Answers save automatically.</div><button class="btn danger sheet-submit" id="mSubmit" type="button">Submit Test</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');
const qs=new URLSearchParams(location.search),testId=qs.get('test');
let questions=[],answers=new Map(),idx=0,attemptId=null,deadline=0,timerId=null,admin=false,activeTest=false,submitting=false;
let review=new Set(),bookmarks=new Set(),testData=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function err(m){$('error').innerHTML='<div class="error">'+esc(m)+'</div>';$('loading').style.display='none'}
function markKey(){return attemptId?'xag-test-marks:'+attemptId:'xag-test-marks:'+testId}
function loadMarks(){try{const x=JSON.parse(localStorage.getItem(markKey())||'{}');review=new Set(x.review||[]);bookmarks=new Set(x.bookmarks||[])}catch{}}
function saveMarks(){localStorage.setItem(markKey(),JSON.stringify({review:[...review],bookmarks:[...bookmarks]}))}
async function getQuestions(){const {data,error}=await sb.from('questions').select('id,question_text,question_type,points,negative_marks,sort_order').eq('test_id',testId).order('sort_order');if(error)throw error;return data||[]}
async function getOptions(qsData){const ids=qsData.map(q=>q.id);if(!ids.length)return [];if(admin){const r=await sb.from('options').select('id,question_id,option_text,sort_order').in('question_id',ids).order('sort_order');if(r.error)throw r.error;return r.data||[]}const r=await sb.from('view_options').select('id,question_id,option_text,sort_order').in('question_id',ids).order('sort_order');if(r.error)throw r.error;return r.data||[]}
async function start(){try{
 if(!testId)throw new Error('Test ID missing.');
 const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}
 const {data:p,error:pe}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(pe)throw pe;admin=p?.is_admin===true;
 const {data:started,error:se}=await sb.rpc('start_test',{_test_id:testId});if(se)throw se;const st=Array.isArray(started)?started[0]:started;if(!st?.id)throw new Error('Could not start the attempt.');
 attemptId=st.id;testData=st;$('testTitle').textContent=st.title||'Test';$('testSub').textContent='Xtreme ExamX • '+(st.time_limit_minutes||0)+' minutes';
 loadMarks();const startedMs=Date.parse(st.started_at);const mins=Number(st.time_limit_minutes||0);deadline=(Number.isFinite(startedMs)?startedMs:Date.now())+mins*60000;
 const qsData=await getQuestions();if(!qsData.length)throw new Error('This test has no questions.');
 const opts=await getOptions(qsData);const byQ=new Map();opts.forEach(o=>{if(!byQ.has(o.question_id))byQ.set(o.question_id,[]);byQ.get(o.question_id).push(o)});questions=qsData.map(q=>({...q,options:byQ.get(q.id)||[]}));
 const {data:old,error:oe}=await sb.from('attempt_answers').select('question_id,chosen_option_id,text_answer').eq('attempt_id',attemptId);if(oe)throw oe;(old||[]).forEach(a=>answers.set(a.question_id,a.chosen_option_id||a.text_answer||''));
 $('loading').style.display='none';$('app').style.display='grid';$('mobileNav').style.display='grid';renderPalette();renderQuestion();$('answered').textContent=answers.size+' answered';activeTest=true;window.addEventListener('beforeunload',beforeUnload);history.pushState({xagTest:true},'',location.href);startTimer();
 }catch(e){console.error(e);err(e.message||'Unable to start test.')}}
function beforeUnload(e){if(activeTest&&!submitting){e.preventDefault();e.returnValue='Are you sure you want to leave this test? Your progress is saved automatically.';return e.returnValue}}
window.addEventListener('popstate',()=>{if(activeTest&&!submitting){const leave=confirm('You are currently in a test. If you leave this page, your test will remain in progress. Do you want to leave?');if(leave){activeTest=false;history.back()}else history.pushState({xagTest:true},'',location.href)}});
function startTimer(){clearInterval(timerId);tick();timerId=setInterval(tick,1000)}
function tick(){if(submitting)return;const left=Math.max(0,deadline-Date.now());const s=Math.floor(left/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;$('timer').textContent=[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':');$('timer').classList.toggle('warning',left<=15*60000&&left>5*60000);$('timer').classList.toggle('danger',left<=5*60000);if(left<=0){clearInterval(timerId);submit(true)}}
function paletteButtons(){return questions.map((q,i)=>'<button class="qn '+(i===idx?'active ':'')+(answers.has(q.id)?'done ':'')+(review.has(q.id)?'review ':'')+(bookmarks.has(q.id)?'bookmark':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>').join('')}
function renderPalette(){$('palette').innerHTML=paletteButtons();$('mobilePalette').innerHTML=paletteButtons()}
async function save(q,opt){answers.set(q.id,opt);const {error}=await sb.from('attempt_answers').upsert({attempt_id:attemptId,question_id:q.id,chosen_option_id:opt,text_answer:null},{onConflict:'attempt_id,question_id'});if(error)throw error;$('answered').textContent=answers.size+' answered';renderPalette()}
function updateMarkButtons(){const r=review.has(questions[idx].id),b=bookmarks.has(questions[idx].id);$('reviewBtn').textContent=r?'⚑ Review Marked':'⚑ Mark for Review';$('bookmarkBtn').textContent=b?'🔖 Bookmarked':'🔖 Bookmark';$('reviewBtn').classList.toggle('marked',r);$('bookmarkBtn').classList.toggle('marked',b)}
function renderQuestion(){if(!questions.length)return;const q=questions[idx];$('qcount').textContent='Question '+(idx+1)+' of '+questions.length;$('progress').style.width=((idx+1)/questions.length*100)+'%';$('question').innerHTML=q.question_text||'';const opts=q.options||[];$('options').innerHTML=opts.map(o=>'<label class="opt"><input type="radio" name="option" value="'+esc(o.id)+'" '+(answers.get(q.id)===o.id?'checked':'')+'> <span>'+esc(o.option_text)+'</span></label>').join('');document.querySelectorAll('input[name=option]').forEach(r=>r.addEventListener('change',async e=>{try{await save(q,e.target.value)}catch(x){err(x.message)}}));$('prev').disabled=idx===0;$('next').textContent=idx===questions.length-1?'Last Question':'Next →';$('mPrev').disabled=idx===0;$('mNext').textContent=idx===questions.length-1?'Last Question':'Next →';updateMarkButtons()}
function jump(i){idx=i;renderPalette();renderQuestion();window.scrollTo({top:0,behavior:'smooth'});closePalette()}
function closePalette(){$('paletteSheet').classList.remove('open')}
$('reviewBtn').onclick=()=>{const id=questions[idx].id;review.has(id)?review.delete(id):review.add(id);saveMarks();renderPalette();updateMarkButtons()};$('bookmarkBtn').onclick=()=>{const id=questions[idx].id;bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);saveMarks();renderPalette();updateMarkButtons()};$('prev').onclick=()=>{if(idx>0)jump(idx-1)};$('next').onclick=()=>{if(idx<questions.length-1)jump(idx+1)};
$('mPrev').onclick=()=>{if(idx>0)jump(idx-1)};$('mNext').onclick=()=>{if(idx<questions.length-1)jump(idx+1)};$('mPalette').onclick=()=>{$('paletteSheet').classList.add('open')};$('closePalette').onclick=closePalette;$('paletteSheet').addEventListener('click',e=>{if(e.target===$('paletteSheet'))closePalette()});
$('submit').onclick=()=>submit(false);$('mSubmit').onclick=()=>submit(false);$('paperBtn').onclick=()=>window.open('test-paper.html?test='+encodeURIComponent(testId),'_blank','noopener');
async function submit(auto){if(submitting)return;if(!auto&&!confirm('Submit this test now? You cannot change answers after submission.'))return;submitting=true;$('submit').disabled=true;$('mSubmit').disabled=true;activeTest=false;window.removeEventListener('beforeunload',beforeUnload);clearInterval(timerId);saveMarks();try{const {error}=await sb.rpc('submit_test',{_attempt_id:attemptId});if(error)throw error;closePalette();await showResult()}catch(e){submitting=false;activeTest=true;window.addEventListener('beforeunload',beforeUnload);$('submit').disabled=false;$('mSubmit').disabled=false;err(e.message||'Submit failed')}}
async function showResult(){const {data,error}=await sb.rpc('get_test_result',{_attempt_id:attemptId});if(error)throw error;const r=Array.isArray(data)?data[0]:data,items=r.items||[],total=items.length,attempted=items.filter(x=>x.selected_option_id&&x.selected_option_text!=='अनुत्तरित प्रश्न').length,unanswered=items.filter(x=>!x.selected_option_id||x.is_unanswered).length,correct=items.filter(x=>x.is_correct).length,wrong=items.filter(x=>x.selected_option_id&&!x.is_unanswered&&!x.is_correct).length,score=items.reduce((a,x)=>a+Number(x.marks||0),0),accuracy=attempted?(correct/attempted)*100:0,saved=JSON.parse(localStorage.getItem(markKey())||'{}'),reviewed=new Set(saved.review||[]),booked=new Set(saved.bookmarks||[]);$('mobileNav').style.display='none';$('app').innerHTML='<section class="card result"><h1>Test Submitted 🎉</h1><div class="score">'+score.toFixed(2)+'</div><p class="sub">Detailed performance analysis</p><div class="result-grid"><div class="result-stat">Correct<b>'+correct+'</b></div><div class="result-stat">Wrong<b>'+wrong+'</b></div><div class="result-stat">Unattempted<b>'+unanswered+'</b></div><div class="result-stat">Accuracy<b>'+accuracy.toFixed(1)+'%</b></div></div><div class="analysis-tools" id="analysisTools"><button class="active" data-filter="all">All ('+total+')</button><button data-filter="correct">Correct ('+correct+')</button><button data-filter="wrong">Wrong ('+wrong+')</button><button data-filter="unanswered">Unattempted ('+unanswered+')</button><button data-filter="review">Review ('+items.filter(x=>reviewed.has(x.question_id)).length+')</button><button data-filter="bookmark">Bookmark ('+items.filter(x=>booked.has(x.question_id)).length+')</button></div><div class="analysis-list" id="analysisList"></div><div class="result-actions"><a class="btn" href="test-series.html">Back to Test Series</a></div></section>';function render(f){const list=items.filter(x=>f==='all'||(f==='correct'&&x.is_correct)||(f==='wrong'&&x.selected_option_id&&!x.is_unanswered&&!x.is_correct)||(f==='unanswered'&&(!x.selected_option_id||x.is_unanswered))||(f==='review'&&reviewed.has(x.question_id))||(f==='bookmark'&&booked.has(x.question_id)));$('analysisList').innerHTML=list.map(x=>{const u=!x.selected_option_id||x.is_unanswered,cls=x.is_correct?'correct':u?'unanswered':'wrong',status=x.is_correct?'CORRECT':u?'UNATTEMPTED':'WRONG';return '<article class="analysis-item '+cls+'"><div class="analysis-head"><strong>Question '+x.question_no+'</strong><span class="status-pill">'+status+' · '+Number(x.marks||0).toFixed(2)+'</span></div><div class="question" style="margin-top:8px">'+x.question_text+'</div><div class="answer-box"><div class="your"><b>Your answer:</b> '+esc(x.selected_option_text||'उत्तर नहीं दिया')+'</div><div class="correct-answer"><b>Correct answer:</b> '+esc(x.correct_option_text||'—')+'</div></div>'+(x.explanation?'<div class="explanation"><b>Explanation:</b><br>'+x.explanation+'</div>':'')+'</article>'}).join('')||'<p class="sub">No questions in this filter.</p>'}document.querySelectorAll('#analysisTools button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#analysisTools button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render('all');$('timer').textContent='COMPLETED'}
start();
</script></body></html>
