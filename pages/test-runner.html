<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test | Xtreme ExamX</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/theme-controls.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--black,#FAF5EF);color:var(--white,#2C1A1D);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1050px,94%);margin:auto}header{position:sticky;top:0;z-index:20;background:var(--surface,#FFFBF7);border-bottom:1px solid var(--border);box-shadow:0 5px 20px #0000000a}.bar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:900}.timer{font-variant-numeric:tabular-nums;background:var(--surface-2,#F7EBE1);border:1px solid var(--border);padding:9px 12px;border-radius:10px;font-weight:900}.progress{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold,#D9531E),var(--gold-light,#F2815B))}.layout{display:grid;grid-template-columns:1fr 245px;gap:15px;padding:20px 0 80px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}.qmeta{display:flex;justify-content:space-between;color:var(--gray);font-size:11px;margin-bottom:12px}.question{font-size:18px;line-height:1.7}.question table{max-width:100%;display:block;overflow:auto}.opts{display:grid;gap:10px;margin-top:20px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:13px;border-radius:12px;cursor:pointer;background:var(--surface)}.opt:hover{background:var(--surface-2)}.opt input{margin-top:3px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;background:linear-gradient(135deg,var(--gold,#D9531E),var(--gold-light,#F2815B));color:#fff;padding:11px 15px;border-radius:10px;font-weight:900;cursor:pointer}.btn.secondary{background:var(--surface-2);color:var(--white);border:1px solid var(--border)}.btn.danger{background:#a63a3a}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qn{padding:8px 0;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;font-size:10px}.qn.active{outline:2px solid var(--gold)}.qn.done{background:var(--surface-2)}.qn.review{border-color:#d98a2b;background:#fff1d9}.qn.bookmark{box-shadow:inset 0 -3px 0 #d9531e}.markbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.markbar .btn{font-size:12px;padding:9px 11px}.btn.marked{outline:2px solid var(--gold)}.side h3{font-size:13px;margin-top:0}.muted{color:var(--gray);font-size:11px;line-height:1.5}.error{color:#9b3030;background:#f8e4e4;border:1px solid #e4b1b1;padding:12px;border-radius:10px;margin:10px 0}.result{text-align:center}.result .score{font-size:44px;font-weight:900;margin:12px}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;text-align:left}.result-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px}.result-stat b{display:block;font-size:20px}.analysis-tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.analysis-tools button{border:1px solid var(--border);background:var(--surface);color:var(--white);padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.analysis-tools button.active{background:var(--gold);color:#fff}.analysis-list{display:grid;gap:12px;text-align:left}.analysis-item{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--surface)}.analysis-item.correct{border-left:5px solid #4f8a55}.analysis-item.wrong{border-left:5px solid #b04444}.analysis-item.unanswered{border-left:5px solid #b7832f}.analysis-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.status-pill{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:var(--surface-2)}.answer-box{display:grid;gap:6px;margin-top:10px;font-size:13px}.answer-box .your{color:#9b3030}.answer-box .correct-answer{color:#3e7043}.explanation{margin-top:12px;padding:12px;background:var(--surface-2);border-radius:10px;line-height:1.6;font-size:13px}.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}@media(max-width:650px){.result-grid{grid-template-columns:repeat(2,1fr)}}.loading{text-align:center;padding:60px;color:var(--gray)}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:-1}.palette{grid-template-columns:repeat(10,1fr)}}
</style></head><body><header><div class="wrap bar"><div class="title" id="testTitle">Loading…</div><div class="timer" id="timer">--:--:--</div></div><div class="wrap"><div class="progress"><i id="progress"></i></div></div></header><main class="wrap"><div id="error"></div><div id="loading" class="loading">Preparing your test…</div><div id="app" class="layout" style="display:none"><section class="card"><div class="qmeta"><span id="qcount">Question 1</span><span id="answered">0 answered</span></div><div id="question" class="question"></div><div id="options" class="opts"></div><div class="markbar"><button class="btn secondary" id="reviewBtn" type="button">⚑ Mark for Review</button><button class="btn secondary" id="bookmarkBtn" type="button">🔖 Bookmark</button></div><div class="actions"><button class="btn secondary" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div></section><aside class="card side"><h3>Questions</h3><div id="palette" class="palette"></div><p class="muted" style="margin-top:14px">Tap a number to jump. Selected answers are saved automatically.</p><p class="muted">🟨 Review &nbsp; 🔖 Bookmark</p><button class="btn danger" id="submit" style="width:100%;margin-top:10px">Submit Test</button></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');
const qs=new URLSearchParams(location.search);const testId=qs.get('test');
let questions=[],answers=new Map(),idx=0,attemptId=null,deadline=0,timerId=null,admin=false;
let review=new Set(),bookmarks=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function err(m){$('error').innerHTML=`<div class="error">${esc(m)}</div>`;$('loading').style.display='none'}
function markKey(){return attemptId?`xag-test-marks:${attemptId}`:`xag-test-marks:${testId}`}
function loadMarks(){try{const x=JSON.parse(localStorage.getItem(markKey())||'{}');review=new Set(x.review||[]);bookmarks=new Set(x.bookmarks||[])}catch{}}
function saveMarks(){localStorage.setItem(markKey(),JSON.stringify({review:[...review],bookmarks:[...bookmarks]}));}
async function getOptions(q){
  if(admin){const {data,error}=await sb.from('options').select('id,question_id,option_text,sort_order').eq('question_id',q.id).order('sort_order');if(error)throw error;return data||[]}
  const {data,error}=await sb.from('view_options').select('id,question_id,option_text,sort_order').eq('question_id',q.id).order('sort_order');if(error)throw error;return data||[]
}
async function start(){try{
  if(!testId)throw new Error('Test ID missing.');
  const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}
  const {data:p,error:pe}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(pe)throw pe;admin=p?.is_admin===true;
  const {data:started,error:se}=await sb.rpc('start_test',{_test_id:testId});if(se)throw se;
  let st=Array.isArray(started)?started[0]:started;attemptId=st?.id||st?.attempt_id;if(!attemptId)throw new Error('Could not start the attempt.');
  loadMarks();
  const {data:t,error:te}=await sb.from('tests').select('id,title,time_limit_minutes,is_published,test_series_id').eq('id',testId).single();if(te)throw te;$('testTitle').textContent=t.title;
  const {data:qsData,error:qe}=await sb.from('questions').select('id,question_text,question_type,points,negative_marks,sort_order').eq('test_id',testId).order('sort_order');if(qe)throw qe;
  questions=[];for(const q of qsData||[]){questions.push({...q,options:await getOptions(q)})}if(!questions.length)throw new Error('This test has no questions.');
  const {data:old,error:oe}=await sb.from('attempt_answers').select('question_id,chosen_option_id,text_answer').eq('attempt_id',attemptId);if(oe)throw oe;(old||[]).forEach(a=>answers.set(a.question_id,a.chosen_option_id||a.text_answer||''));
  const mins=Number(t.time_limit_minutes||0);deadline=Date.now()+mins*60000;renderPalette();renderQuestion();$('loading').style.display='none';$('app').style.display='grid';timerId=setInterval(tick,1000);tick();
}catch(e){console.error(e);err(e.message||'Unable to start test.')}}
function tick(){const left=Math.max(0,deadline-Date.now());const s=Math.floor(left/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;$('timer').textContent=[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':');if(left<=0){clearInterval(timerId);submit(true)}}
function renderPalette(){const p=$('palette');p.innerHTML=questions.map((q,i)=>`<button class="qn ${i===idx?'active':''} ${answers.has(q.id)?'done':''} ${review.has(q.id)?'review':''} ${bookmarks.has(q.id)?'bookmark':''}" title="${review.has(q.id)?'Marked for review':''}${review.has(q.id)&&bookmarks.has(q.id)?' • ':''}${bookmarks.has(q.id)?'Bookmarked':''}" onclick="jump(${i})">${i+1}</button>`).join('')}
async function save(q,opt){answers.set(q.id,opt);const {error}=await sb.from('attempt_answers').upsert({attempt_id:attemptId,question_id:q.id,chosen_option_id:opt,text_answer:null},{onConflict:'attempt_id,question_id'});if(error)throw error;renderPalette();$('answered').textContent=`${answers.size} answered`}
function updateMarkButtons(){const r=review.has(questions[idx].id),b=bookmarks.has(questions[idx].id);$('reviewBtn').textContent=r?'⚑ Review Marked':'⚑ Mark for Review';$('bookmarkBtn').textContent=b?'🔖 Bookmarked':'🔖 Bookmark';$('reviewBtn').classList.toggle('marked',r);$('bookmarkBtn').classList.toggle('marked',b)}
function renderQuestion(){const q=questions[idx];$('qcount').textContent=`Question ${idx+1} of ${questions.length}`;$('progress').style.width=((idx+1)/questions.length*100)+'%';$('question').innerHTML=q.question_text;$('options').innerHTML=q.options.map(o=>`<label class="opt"><input type="radio" name="option" value="${esc(o.id)}" ${answers.get(q.id)===o.id?'checked':''}> <span>${esc(o.option_text)}</span></label>`).join('');document.querySelectorAll('input[name=option]').forEach(r=>r.addEventListener('change',async e=>{try{await save(q,e.target.value)}catch(x){err(x.message)}}));$('prev').disabled=idx===0;$('next').textContent=idx===questions.length-1?'Last Question':'Next →';updateMarkButtons()}
function jump(i){idx=i;renderPalette();renderQuestion()}
$('reviewBtn').onclick=()=>{const id=questions[idx].id;review.has(id)?review.delete(id):review.add(id);saveMarks();renderPalette();updateMarkButtons()};
$('bookmarkBtn').onclick=()=>{const id=questions[idx].id;bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);saveMarks();renderPalette();updateMarkButtons()};
$('prev').onclick=()=>{if(idx>0){idx--;renderPalette();renderQuestion()}};$('next').onclick=()=>{if(idx<questions.length-1){idx++;renderPalette();renderQuestion()}};$('submit').onclick=()=>submit(false);
async function submit(auto){if(!auto&&!confirm('Submit this test now? You cannot change answers after submission.'))return;try{$('submit').disabled=true;clearInterval(timerId);saveMarks();const {data,error}=await sb.rpc('submit_test',{_attempt_id:attemptId});if(error)throw error;await showResult();}catch(e){$('submit').disabled=false;err(e.message||'Submit failed')}}
async function showResult(){
  const {data,error}=await sb.rpc('get_test_result',{_attempt_id:attemptId});
  if(error)throw error;
  const r=Array.isArray(data)?data[0]:data; const items=r.items||[];
  const total=items.length, attempted=items.filter(x=>x.selected_option_id&&x.selected_option_text!=='अनुत्तरित प्रश्न').length;
  const unanswered=items.filter(x=>!x.selected_option_id||x.is_unanswered).length;
  const correct=items.filter(x=>x.is_correct).length, wrong=items.filter(x=>x.selected_option_id&& !x.is_unanswered && !x.is_correct).length;
  const score=items.reduce((a,x)=>a+Number(x.marks||0),0);
  const accuracy=attempted?((correct/attempted)*100):0;
  const marks=items.length?items.reduce((a,x)=>a+Math.max(0,Number(x.marks||0)),0):0;
  const maxMarks=items.reduce((a,x)=>a+Number(x.marks||0)>a?Number(x.marks||0):a,0); // informational only
  const marksPct = total?Math.max(0,Math.min(100,(score/(total*(Number(items[0]?.marks||0)||1)))*100)):0;
  const saved=JSON.parse(localStorage.getItem(markKey())||'{}'); const reviewed=new Set(saved.review||[]), booked=new Set(saved.bookmarks||[]);
  $('app').innerHTML=`<section class="card result"><h1>Test Submitted 🎉</h1><div class="score">${score.toFixed(2)}</div><p class="muted">Detailed performance analysis</p><div class="result-grid">
    <div class="result-stat"><span>Correct</span><b>${correct}</b></div><div class="result-stat"><span>Wrong</span><b>${wrong}</b></div><div class="result-stat"><span>Unattempted</span><b>${unanswered}</b></div><div class="result-stat"><span>Accuracy</span><b>${accuracy.toFixed(1)}%</b></div>
  </div><div class="analysis-tools" id="analysisTools"><button class="active" data-filter="all">All (${total})</button><button data-filter="correct">Correct (${correct})</button><button data-filter="wrong">Wrong (${wrong})</button><button data-filter="unanswered">Unattempted (${unanswered})</button><button data-filter="review">Review (${items.filter(x=>reviewed.has(x.question_id)).length})</button><button data-filter="bookmark">Bookmark (${items.filter(x=>booked.has(x.question_id)).length})</button></div><div class="analysis-list" id="analysisList"></div><div class="result-actions"><a class="btn" href="test-series.html">Back to Test Series</a></div></section>`;
  function render(filter){
    const list=items.filter(x=>filter==='all'||(filter==='correct'&&x.is_correct)||(filter==='wrong'&&x.selected_option_id&&!x.is_unanswered&&!x.is_correct)||(filter==='unanswered'&&(!x.selected_option_id||x.is_unanswered))||(filter==='review'&&reviewed.has(x.question_id))||(filter==='bookmark'&&booked.has(x.question_id)));
    $('analysisList').innerHTML=list.map(x=>{const unanswered=!x.selected_option_id||x.is_unanswered;const cls=x.is_correct?'correct':unanswered?'unanswered':'wrong';const status=x.is_correct?'CORRECT':unanswered?'UNATTEMPTED':'WRONG';const your=x.selected_option_text||'उत्तर नहीं दिया';return `<article class="analysis-item ${cls}"><div class="analysis-head"><strong>Question ${x.question_no}</strong><span class="status-pill">${status} · ${Number(x.marks||0).toFixed(2)}</span></div><div class="question" style="margin-top:8px">${x.question_text}</div><div class="answer-box"><div class="your"><b>Your answer:</b> ${esc(your)}</div><div class="correct-answer"><b>Correct answer:</b> ${esc(x.correct_option_text||'—')}</div></div>${x.explanation?`<div class="explanation"><b>Explanation:</b><br>${x.explanation}</div>`:''}${reviewed.has(x.question_id)?'<div class="muted" style="margin-top:8px">⚑ Marked for review</div>':''}${booked.has(x.question_id)?'<div class="muted" style="margin-top:4px">🔖 Bookmarked</div>':''}</article>`}).join('')||'<p class="muted">No questions in this filter.</p>';
  }
  document.querySelectorAll('#analysisTools button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#analysisTools button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}); render('all'); $('timer').textContent='COMPLETED';
}
window.jump=jump;start();
</script>
</script></body></html>
