<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Xtreme AG Apps</title><script src="../js/theme-init.js"></script><style>
:root{--bg:#FAF5EF;--surface:#FFFBF7;--text:#2C1A1D;--muted:#7A6666;--primary:#D9531E;--secondary:#F2815B;--border:rgba(217,83,30,.15)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffaf5,#f7ebe1);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(980px,92%);margin:auto}header{position:sticky;top:0;z-index:10;background:rgba(255,251,247,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.logo{width:40px;height:40px;border:2px solid var(--primary);border-radius:12px;display:grid;place-items:center;color:var(--primary)}.brand span{color:var(--secondary)}nav{display:flex;gap:18px;font-size:13px}nav a{text-decoration:none;color:var(--muted)}main{padding:45px 0 70px}.eyebrow{display:inline-block;padding:7px 11px;border:1px solid var(--border);border-radius:999px;color:var(--primary);font-size:10px;font-weight:900;letter-spacing:1.4px}.hero h1{font-size:clamp(34px,6vw,52px);margin:15px 0 8px}.hero p{color:var(--muted)}.profile-card{margin-top:25px;background:var(--surface);border:1px solid var(--border);border-radius:25px;padding:25px;box-shadow:0 18px 55px rgba(75,45,30,.08)}.identity{display:flex;gap:18px;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--border)}.avatar{width:78px;height:78px;border-radius:24px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.identity h2{margin:0;font-size:22px}.identity p{margin:4px 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:22px}.field{background:#fffaf5;border:1px solid var(--border);border-radius:16px;padding:16px}.field small{display:block;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:9px;font-weight:900;margin-bottom:6px}.field strong{font-size:15px;word-break:break-word}.actions{display:flex;gap:10px;margin-top:22px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:12px 17px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;text-decoration:none;font-weight:900;font-size:12px}.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}.error{padding:14px;border-radius:14px;background:#fff0ed;border:1px solid #efc4ba;color:#a33724}@media(max-width:600px){nav{gap:10px}.grid{grid-template-columns:1fr}.identity{align-items:flex-start}.actions{flex-direction:column}.btn{width:100%}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="../index.html"><div class="logo">X</div><div>Xtreme <span>AG Apps</span></div></a><nav><a href="dashboard.html">Dashboard</a><a href="test-series.html">Tests</a></nav></div></header><main><div class="wrap"><div class="hero"><span class="eyebrow">MY ACCOUNT</span><h1>My Profile.</h1><p>Your personal details and Xtreme AG Apps account information.</p></div><div id="app"><div class="profile-card">Loading profile…</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const initials=n=>(n||'User').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'U';
(async()=>{try{const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session){location.replace('login.html');return}const u=session.user;const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(pe)throw pe;if(!p){location.replace('complete-profile.html');return}const name=p.display_name||p.full_name||u.user_metadata?.full_name||u.email?.split('@')[0]||'User';const avatar=p.avatar_url||p.photo_url||u.user_metadata?.avatar_url||'';app.innerHTML=`<section class="profile-card"><div class="identity"><div class="avatar">${avatar?`<img src="${esc(avatar)}" alt="Profile photo">`:esc(initials(name))}</div><div><h2>${esc(name)}</h2><p>${esc(u.email||'')}</p></div></div><div class="grid"><div class="field"><small>Full Name</small><strong>${esc(name)}</strong></div><div class="field"><small>Email</small><strong>${esc(u.email||'Not available')}</strong></div><div class="field"><small>Mobile Number</small><strong>${esc(p.mobile||'Not added')}</strong></div><div class="field"><small>State / UT</small><strong>${esc(p.state||'Not added')}</strong></div></div><div class="actions"><a class="btn" href="dashboard.html">← Back to Dashboard</a><a class="btn secondary" href="complete-profile.html">Edit Profile</a></div></section>`}catch(e){app.innerHTML=`<div class="error">${esc(e.message||'Unable to load profile.')}</div>`}})();
</script></body></html>
