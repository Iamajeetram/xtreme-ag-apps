<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy Note | Xtreme ExamX</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/theme-controls.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#FAF5EF);color:var(--text,#2C1A1D);font-family:Inter,system-ui,sans-serif}.wrap{width:min(700px,92%);margin:auto}header{border-bottom:1px solid var(--border);background:var(--surface);padding:18px 0}.card{margin:32px 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px}.price{font-size:30px;font-weight:950;margin:12px 0}.muted{color:var(--muted);font-size:12px;line-height:1.6}label{display:block;font-size:11px;font-weight:800;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:inherit}.btn{width:100%;margin-top:17px;border:0;background:var(--primary,#D9531E);color:#fff;padding:13px;border-radius:11px;font-weight:900}.msg{padding:12px;border-radius:10px;margin-top:15px}.ok{background:#e8f4e5;color:#316b31}.err{background:#f8e4e4;color:#9b3030}
</style></head><body><header><div class="wrap"><a href="notes.html">← Back to Notes</a></div></header><main class="wrap"><div class="card"><div id="content">Loading...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const id=new URLSearchParams(location.search).get('note');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session){location.replace('login.html');return}const {data:n,error}=await sb.from('notes').select('id,title,description,exam_name,category,price,is_free,is_published').eq('id',id).eq('is_published',true).single();if(error)throw error;if(n.is_free){location.replace('notes.html');return}const {data:a}=await sb.from('note_access').select('access_status,expires_at').eq('user_id',session.user.id).eq('note_id',id).maybeSingle();if(a?.access_status==='active'&&(!a.expires_at||new Date(a.expires_at)>new Date())){$('content').innerHTML=`<h1>${esc(n.title)}</h1><p class="muted">Already unlocked.</p><a class="btn" href="notes.html">Open Notes</a>`;return}const {data:pending}=await sb.from('payments').select('id,status').eq('user_id',session.user.id).eq('note_id',id).eq('status','PENDING').maybeSingle();const profile=await sb.from('profiles').select('display_name,mobile').eq('id',session.user.id).maybeSingle();$('content').innerHTML=`<h1>${esc(n.title)}</h1><p class="muted">${esc(n.description||'')}</p><p class="muted">${esc(n.exam_name||'')} ${n.category?'• '+esc(n.category):''}</p><div class="price">₹${Number(n.price||0).toFixed(0)}</div>${pending?'<div class="msg ok">Payment already submitted. Admin approval is pending.</div>':`<p class="muted">Pay using your configured payment method, then submit the UTR below. Access is unlocked only after admin approval.</p><label>Name</label><input id="name" value="${esc(profile.data?.display_name||session.user.user_metadata?.full_name||'')}"><label>Mobile</label><input id="mobile" value="${esc(profile.data?.mobile||'')}" inputmode="numeric"><label>UTR / Payment ID</label><input id="utr" placeholder="Enter UTR / transaction ID"><label>Payment Date & Time</label><input id="ptime" type="datetime-local"><button class="btn" id="send">Submit Payment for Verification</button><div id="msg"></div>`}`;if($('send'))$('send').onclick=submit}
async function submit(){const name=$('name').value.trim(),mobile=$('mobile').value.trim(),utr=$('utr').value.trim(),ptime=$('ptime').value;if(!name||!mobile||!utr||!ptime){$('msg').className='msg err';$('msg').textContent='Please fill all payment fields.';return}const {error}=await sb.rpc('create_note_payment',{_note_id:id,_name:name,_mobile:mobile,_utr:utr,_payment_time:new Date(ptime).toISOString()});if(error){$('msg').className='msg err';$('msg').textContent=error.message;return}$('msg').className='msg ok';$('msg').textContent='Payment submitted. Admin approval is pending.';$('send').disabled=true}
load().catch(e=>{$('content').innerHTML='<div class="msg err">'+esc(e.message||'Unable to load')+'</div>'});
</script></body></html>
