<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Dashboard | Xtreme AG Apps</title>
<meta name="description" content="Your Xtreme AG Apps learning dashboard.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#faf5ef;--surface:#fffdf9;--surface2:#f8e8dc;--primary:#d9531e;--primary2:#f2815b;--text:#2c1a1d;--muted:#78696a;--border:#eadbd0;--green:#35b98a;--blue:#3988e8;--purple:#7956d9;--shadow:0 12px 35px rgba(76,43,28,.08)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden}a{text-decoration:none;color:inherit}button{font:inherit}.container{width:min(1180px,92%);margin:auto}
header{position:sticky;top:0;z-index:50;background:rgba(255,253,249,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(217,83,30,.12)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:19px;white-space:nowrap}.logo{width:40px;height:40px;border:2px solid var(--primary);border-radius:11px;display:grid;place-items:center;color:var(--primary);font-size:22px;font-weight:900}.brand span{color:var(--primary)}nav{display:flex;align-items:center;gap:26px}nav a{font-size:14px;color:var(--muted);font-weight:650}nav a.active,nav a:hover{color:var(--primary)}.logout-btn{border:1px solid var(--border);border-radius:999px;padding:9px 13px;background:var(--surface);color:var(--primary);font-weight:850;cursor:pointer;font-size:12px}.logout-btn:hover{background:#fff0e7}.profile{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:#fff}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--primary);font-weight:850;font-size:12px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.caret{font-size:13px;color:var(--muted)}.menu{display:none;border:0;background:transparent;font-size:24px;color:var(--text)}
main{padding:28px 0 42px}.hero{min-height:340px;border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(90deg,rgba(250,245,239,.98) 0%,rgba(250,245,239,.93) 43%,rgba(250,245,239,.35) 72%,rgba(250,245,239,.12) 100%),url('https://images.unsplash.com/photo-1769794371055-54436b54577e?auto=format&fit=crop&fm=jpg&q=82&w=1600') center/cover;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center}.hero-content{padding:45px 48px;max-width:650px}.eyebrow,.kicker{font-size:11px;font-weight:850;letter-spacing:1.3px;text-transform:uppercase;color:var(--primary)}h1{font-size:clamp(34px,5vw,55px);line-height:1.05;letter-spacing:-1.7px;margin:9px 0 12px;font-weight:900}.hero p{font-size:16px;color:var(--muted);max-width:500px}.quote{margin-top:24px;background:rgba(255,253,249,.9);border:1px solid rgba(217,83,30,.12);border-radius:17px;padding:15px 18px;width:max-content;max-width:100%;box-shadow:0 10px 30px rgba(76,43,28,.07)}.quote strong{font-size:14px}.quote small{display:block;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:17px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}.orange{background:#ffeadf;color:var(--primary)}.blue{background:#e5f0ff;color:var(--blue)}.green{background:#e3f7ef;color:var(--green)}.purple{background:#eee8ff;color:var(--purple)}.stat b{display:block;font-size:22px;line-height:1}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.grid{display:grid;grid-template-columns:1.45fr .9fr;gap:18px}.journey,.continue,.feature{background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}.journey{min-height:220px;padding:30px;position:relative;overflow:hidden;background:linear-gradient(135deg,#fde9dc,#fff8f1)}.journey h2{font-size:28px;line-height:1.15;max-width:390px}.journey p{color:#9a5941;margin:10px 0 22px;max-width:390px}.target{position:absolute;right:35px;bottom:20px;width:145px;height:145px;border-radius:50%;background:repeating-radial-gradient(circle,#fff 0 11px,#f2815b 12px 22px,#fff 23px 33px,#d9531e 34px 44px);box-shadow:0 10px 25px rgba(217,83,30,.16)}.target:after{content:"";position:absolute;width:105px;height:7px;background:var(--text);transform:rotate(-45deg);right:-10px;top:44px;border-radius:10px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;padding:12px 19px;border-radius:12px;font-size:13px;font-weight:800;box-shadow:0 8px 20px rgba(217,83,30,.18);transition:.2s}.btn:hover{transform:translateY(-2px);background:#c74817}.continue{padding:25px}.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-row h3{font-size:17px}.view{font-size:12px;color:var(--primary);font-weight:800}.test-card{border:1px solid var(--border);border-radius:17px;padding:17px;background:#fffaf5}.test-top{display:flex;gap:12px;align-items:center}.doc{width:44px;height:44px;border-radius:13px;background:#ffeadf;color:var(--primary);display:grid;place-items:center;font-size:22px}.test-title{font-weight:800;font-size:14px}.test-sub{color:var(--muted);font-size:12px;margin-top:2px}.test-card .btn{width:100%;margin-top:15px}
.section-title{font-size:20px;margin:25px 0 13px}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.feature{padding:20px;min-height:180px;transition:.2s}.feature:hover{transform:translateY(-3px)}.feature h3{font-size:15px;margin:13px 0 6px}.feature p{font-size:12px;color:var(--muted);min-height:54px}.feature .mini-btn{display:inline-block;margin-top:13px;color:#8f351e;background:#fff0e7;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:800}.bottom-quote{margin-top:18px;min-height:130px;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(90deg,rgba(253,233,220,.95),rgba(253,233,220,.35)),url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&fm=jpg&q=80&w=1400') center/cover;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.bottom-quote strong{font-size:19px}.bottom-quote p{font-size:12px;color:var(--muted);margin-top:5px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:12px 0 28px}.error{background:#fff0ed;border:1px solid #efc4ba;color:#a33724;border-radius:14px;padding:14px;margin:15px 0}.loading{padding:80px;text-align:center;color:var(--muted)}
@media(max-width:900px){nav{display:none}.menu{display:block}.profile{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.features{grid-template-columns:repeat(2,1fr)}.hero{min-height:380px;background:linear-gradient(90deg,rgba(250,245,239,.96),rgba(250,245,239,.68)),url('https://images.unsplash.com/photo-1769794371055-54436b54577e?auto=format&fit=crop&fm=jpg&q=82&w=1000') center/cover}.hero-content{padding:35px 28px}}
@media(max-width:560px){.container{width:min(94%,520px)}main{padding-top:14px}.nav{height:68px}.brand{font-size:16px}.logo{width:36px;height:36px}.hero{border-radius:21px;min-height:420px}.hero-content{padding:27px 21px;align-self:flex-start;margin-top:5px}.hero p{font-size:14px}.quote{width:100%}h1{font-size:39px}.stats{gap:9px}.stat{padding:13px 10px;gap:8px}.icon{width:36px;height:36px;font-size:17px}.stat b{font-size:18px}.stat span{font-size:10px}.journey{padding:23px;min-height:230px}.journey h2{font-size:25px}.target{width:100px;height:100px;right:20px;bottom:17px}.features{grid-template-columns:1fr 1fr;gap:9px}.feature{padding:14px;min-height:175px}.feature p{font-size:11px}.bottom-quote{min-height:150px}.bottom-quote strong{font-size:16px}}
.theme-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.swatch.warmCream{background:linear-gradient(135deg,#FAF5EF 50%,#D9531E 50%)}.swatch.obsidian{background:linear-gradient(135deg,#070707 50%,#d4af37 50%)}.swatch.cyber{background:linear-gradient(135deg,#07131d 50%,#16e0ff 50%)}.swatch.vapor{background:linear-gradient(135deg,#160d2b 50%,#ff48d7 50%)}.swatch.emerald{background:linear-gradient(135deg,#061816 50%,#2ee99b 50%)}.swatch.gold{background:linear-gradient(135deg,#100d08 50%,#ffd66b 50%)}.swatch.mughal{background:linear-gradient(135deg,#210d0b 50%,#d79a4b 50%)}.swatch.rajasthani{background:linear-gradient(135deg,#061b22 50%,#e2b953 50%)}.swatch.kalamkari{background:linear-gradient(135deg,#ead8b7 50%,#a9472d 50%)}.swatch.light{background:linear-gradient(135deg,#f6f8fc 50%,#5b45e8 50%)}.swatch.kawaii{background:linear-gradient(135deg,#fff4f8 50%,#ee72ad 50%)}.swatch.active{outline:2px solid var(--gold);outline-offset:2px}</style>
<link rel="stylesheet" href="../css/theme-controls.css"><script src="../js/theme-controls.js"></script></head>
<body>
<header><div class="container nav"><a class="brand" href="../index.html"><div class="logo">X</div><div>Xtreme <span>AG Apps</span></div></a><nav><a class="active" href="./dashboard.html">Dashboard</a></nav><a class="profile" id="profileHeader" href="./profile.html"><div class="avatar" id="headerAvatar">X</div><strong id="headerName">User</strong><span class="caret">⌄</span></a><button class="logout-btn" id="logoutDash" type="button">Logout</button><button class="menu" id="themeDash" aria-label="Theme controls">🎨</button></div></header>
<div class="theme-popover" id="themePopover" style="display:none;position:fixed;right:18px;top:76px;z-index:100;width:250px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 50px #0002"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>Theme</strong><button id="closeTheme" style="border:0;background:none;font-size:22px">×</button></div><div class="theme-grid"><button class="swatch warmCream" data-theme="warmCream" title="Warm Cream" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch obsidian" data-theme="obsidian" title="Obsidian" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch cyber" data-theme="cyber" title="Cyber" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch vapor" data-theme="vapor" title="Vapor" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch emerald" data-theme="emerald" title="Emerald" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch gold" data-theme="gold" title="Gold" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch mughal" data-theme="mughal" title="Mughal" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch rajasthani" data-theme="rajasthani" title="Rajasthani" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch kalamkari" data-theme="kalamkari" title="Kalamkari" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch light" data-theme="light" title="Light" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button><button class="swatch kawaii" data-theme="kawaii" title="Kawaii" style="width:29px;height:29px;border-radius:50%;border:0;cursor:pointer"></button></div></div><main><div class="container" id="app"><div class="loading">Loading your dashboard…</div></div></main>
<footer>© 2026 Xtreme AG Apps. All rights reserved.</footer>
<script>
const SUPABASE_URL='https://vbfjafblxnrfminbdlbb.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function initials(n){return (n||'User').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'U'}
async function load(){try{const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session){location.replace('./login.html');return}const u=session.user;const meta=u.user_metadata||{};let {data:p,error:pe}=await sb.from('profiles').select('display_name,mobile,state').eq('id',u.id).maybeSingle();if(pe)throw pe;if(!p||!p.display_name||!p.mobile||!p.state){location.replace('./complete-profile.html');return}const name=p.display_name;document.getElementById('headerName').textContent=name;document.getElementById('headerAvatar').textContent=initials(name);let attempts=[];try{const r=await sb.from('attempts').select('id,test_id,status,score,finished_at').eq('user_id',u.id).order('finished_at',{ascending:false});if(!r.error)attempts=r.data||[]}catch(e){}const completed=attempts.filter(a=>a.status==='completed');const avg=completed.length?completed.reduce((s,a)=>s+Number(a.score||0),0)/completed.length:0;let tests=[];try{const r=await sb.from('tests').select('id,title,test_series_id,duration_minutes,is_free').eq('is_published',true).order('created_at',{ascending:true}).limit(6);if(!r.error)tests=r.data||[]}catch(e){}const latest=tests[0];document.getElementById('app').innerHTML=`
<section class="hero"><div class="hero-content"><div class="eyebrow">YOUR LEARNING DASHBOARD</div><h1>Hello, ${esc(name.split(/\s+/)[0])} 👋</h1><p>Stay consistent, keep practicing.<br>Your goals are closer than you think.</p><div class="quote"><strong>“ Discipline today, success tomorrow. ”</strong><small>Keep going!</small></div></div></section>
<div class="stats"><div class="stat"><div class="icon orange">📝</div><div><b>${completed.length}</b><span>Tests Attempted</span></div></div><div class="stat"><div class="icon blue">📊</div><div><b>${avg.toFixed(0)}</b><span>Avg. Score</span></div></div><div class="stat"><div class="icon green">📅</div><div><b>${new Set(completed.map(a=>a.finished_at?new Date(a.finished_at).toDateString():'' )).size}</b><span>Study Days</span></div></div><div class="stat"><div class="icon purple">◷</div><div><b>0</b><span>Hours Studied</span></div></div></div>
<div class="grid"><section class="journey"><div class="kicker">YOUR PREPARATION</div><h2>Your Learning Journey Starts Here</h2><p>Take tests, improve your preparation and track your progress.</p><a class="btn" href="./test-series.html">Explore Test Series →</a><div class="target"></div></section><aside class="continue"><div class="section-row"><h3>Continue Your Preparation</h3><a class="view" href="./test-series.html">View All →</a></div><div class="test-card">${latest?`<div class="test-top"><div class="doc">📄</div><div><div class="test-title">${esc(latest.title)}</div><div class="test-sub">${latest.is_free?'Free':'Premium'} • Not Attempted</div></div></div><a class="btn" href="./test-series.html">Start Test →</a>`:`<div class="test-top"><div class="doc">📄</div><div><div class="test-title">No tests available yet</div><div class="test-sub">New preparation content will appear here.</div></div></div>`}</div></aside></div>
<h2 class="section-title">Explore More</h2><section class="features"><article class="feature"><div class="icon orange">📝</div><h3>Test Series</h3><p>Attempt full-length tests and subject-wise tests.</p><a class="mini-btn" href="./test-series.html">Go to Tests →</a></article><article class="feature" id="notes"><div class="icon blue">📘</div><h3>Notes</h3><p>Read and download handwritten & topic-wise notes.</p><a class="mini-btn" href="#notes">Explore Notes →</a></article><article class="feature" id="material"><div class="icon green">📚</div><h3>Study Material</h3><p>Access PYQs, current affairs and important resources.</p><a class="mini-btn" href="#material">View Material →</a></article><article class="feature" id="performance"><div class="icon purple">📈</div><h3>Performance</h3><p>Track your progress, strengths and weak areas.</p><a class="mini-btn" href="#performance">View Analysis →</a></article></section>
<section class="bottom-quote"><div><strong>“The expert in anything was once a beginner.”</strong><p>Keep learning. Keep growing.</p></div></section>`}catch(e){document.getElementById('app').innerHTML='<div class="error">Unable to load your dashboard. '+esc(e.message||'Please refresh and try again.')+'</div>'}}
document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('logoutDash');if(b)b.onclick=async()=>{b.disabled=true;b.textContent='Logging out…';const {error}=await sb.auth.signOut({scope:'local'});if(error){b.disabled=false;b.textContent='Logout';alert(error.message);return}location.replace('../index.html')}});
document.addEventListener('DOMContentLoaded',load);
</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('themeDash'),p=document.getElementById('themePopover'),c=document.getElementById('closeTheme');b.onclick=()=>p.style.display=p.style.display==='none'?'block':'none';c.onclick=()=>p.style.display='none';});</script></body></html>
