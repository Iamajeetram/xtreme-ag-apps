<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Xtreme AG Apps</title>
  <meta name="description" content="Login to your Xtreme AG Apps account.">
  <meta name="robots" content="noindex, nofollow">

  <!-- EARLY THEME INIT - PREVENTS FOUC -->
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/theme-controls.css">

  <style>
    :root {
      --black: #000000;
      --surface: #070707;
      --gold: #d4af37;
      --gold-light: #f5d76e;
      --white: #ffffff;
      --gray: #a5a5a5;
      --border: rgba(212, 175, 55, 0.20);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    :focus { outline: none; }
    a:focus-visible, button:focus-visible {
      outline: 3px solid rgba(245, 215, 110, 0.22);
      box-shadow: 0 0 0 4px rgba(245, 215, 110, 0.08);
      border-radius: 8px;
    }

    .login-card {
      max-width: 480px;
      width: 100%;
      padding: 48px 32px;
      background: #030303;
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55);
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.3px;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      border: 2px solid var(--gold);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      font-weight: 900;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.16);
    }

    .logo span { color: var(--gold-light); }
    .login-card h1 { font-size: 32px; margin-bottom: 16px; font-weight: 900; }
    .subtitle { color: var(--gray); font-size: 15px; margin-bottom: 32px; line-height: 1.6; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.25s ease;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-google {
      background: var(--gold);
      color: #000000;
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.16);
      gap: 12px;
    }

    .btn-google:hover { background: var(--gold-light); transform: translateY(-2px); }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.65; cursor: wait; transform: none; }
    .google-icon { width: 20px; height: 20px; flex-shrink: 0; }

    .info-box {
      margin-top: 24px;
      padding: 16px;
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      color: var(--gray);
      line-height: 1.6;
    }

    .status-message {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status-message.show { display: block; }
    .status-message.error { background: rgba(220, 53, 69, 0.10); color: #ff6b6b; border: 1px solid rgba(220, 53, 69, 0.30); }
    .status-message.success { background: rgba(99, 214, 154, 0.08); color: #63d69a; border: 1px solid rgba(99, 214, 154, 0.25); }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0, 0, 0, 0.25);
      border-top: 2px solid #000000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .login-card { padding: 32px 20px; }
      .login-card h1 { font-size: 25px; }
      .logo { font-size: 20px; margin-bottom: 24px; }
      .logo-mark { width: 44px; height: 44px; }
    }
  </style>
</head>

<body>
  <div class="login-card">
    <a href="../" class="logo" aria-label="Xtreme AG Apps home">
      <div class="logo-mark">X</div>
      <div>Xtreme <span>AG Apps</span></div>
    </a>

    <h1>Sign In</h1>
    <p class="subtitle">Use your Google account to access Xtreme AG Apps.</p>

    <button class="btn btn-google" id="googleSignInBtn" type="button">
      <svg class="google-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M23.745 12.27c0-.79-.07-1.54-.189-2.27H12v4.28h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.85c2.27-2.09 3.575-5.17 3.575-8.61z" fill="#1f2937" />
        <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.85-3c-1.08.72-2.45 1.14-4.08 1.14-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.05 21.3 7.12 24 12 24z" fill="#1f2937" />
        <path d="M5.27 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V7.07H1.29A11.99 11.99 0 000 12c0 1.93.48 3.77 1.29 5.38l3.98-3.09z" fill="#1f2937" />
        <path d="M12 4.75c1.77 0 3.35.64 4.6 1.88l3.45-3.45C17.94 1.12 15.24 0 12 0 7.12 0 3.05 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z" fill="#1f2937" />
      </svg>
      <span id="btnText">Continue with Google</span>
    </button>

    <div class="info-box">
      New users will be asked to complete their profile after Google sign-in.
    </div>
    <div class="status-message" id="statusMessage"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/theme-controls.js"></script>

  <script>
    const SUPABASE_URL = 'https://vbfjafblxnrfminbdlbb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showStatus(message, type = 'error') {
      const box = document.getElementById('statusMessage');
      box.textContent = message;
      box.className = 'status-message show ' + type;
    }

    function hideStatus() {
      document.getElementById('statusMessage').className = 'status-message';
    }

    function setLoading(isLoading) {
      const button = document.getElementById('googleSignInBtn');
      const text = document.getElementById('btnText');
      if (isLoading) {
        button.disabled = true;
        text.innerHTML = '<span class="loading-spinner"></span>';
      } else {
        button.disabled = false;
        text.textContent = 'Continue with Google';
      }
    }

    async function handleGoogleSignIn() {
      hideStatus();
      setLoading(true);
      try {
        const redirectUrl = window.location.origin + '/pages/login.html';
        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: redirectUrl, queryParams: { prompt: 'select_account' } }
        });
        if (error) {
          console.error('Google OAuth error:', error);
          showStatus(error.message || 'Google sign-in failed.', 'error');
          setLoading(false);
        }
      } catch (error) {
        console.error('Google sign-in exception:', error);
        showStatus(error.message || 'An error occurred during Google sign-in.', 'error');
        setLoading(false);
      }
    }

    document.getElementById('googleSignInBtn').addEventListener('click', handleGoogleSignIn);

    async function checkExistingSession() {
      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) { console.error('Session check error:', error); return; }
        if (data?.session) { window.location.replace('./dashboard.html'); }
      } catch (error) { console.error('Initial session check error:', error); }
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      console.log('Auth event:', event);
      if (event === 'SIGNED_IN' && session) { window.location.replace('./dashboard.html'); }
    });

    document.addEventListener('DOMContentLoaded', () => { checkExistingSession(); });
  </script>
</body>
</html>
