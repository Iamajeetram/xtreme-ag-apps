<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy Test Series | Xtreme ExamX</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/theme-controls.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--black,#FAF5EF);color:var(--white,#2C1A1D);font-family:Inter,system-ui,sans-serif}.wrap{width:min(700px,92%);margin:auto}header{border-bottom:1px solid var(--border);background:var(--surface);padding:18px 0}.card{margin:35px 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:25px}.price{font-size:32px;font-weight:900;margin:12px 0}.muted{color:var(--gray);font-size:12px;line-height:1.6}label{display:block;font-size:11px;font-weight:800;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--white)}.btn{width:100%;margin-top:18px;border:0;background:linear-gradient(135deg,var(--gold,#D9531E),var(--gold-light,#F2815B));color:#fff;padding:13px;border-radius:11px;font-weight:900}.upi{display:block;text-align:center;padding:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;margin:15px 0;font-weight:900}.msg{padding:12px;border-radius:10px;margin-top:15px}.ok{background:#e8f4e5;color:#316b31}.err{background:#f8e4e4;color:#9b3030}
</style></head><body><header><div class="wrap"><a href="test-series.html">← Back to Test Series</a></div></header><main class="wrap"><div class="card"><div id="content">Loading…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const id=new URLSearchParams(location.search).get('series');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let series,session;
async function load(){try{const r=await sb.auth.getSession();session=r.data.session;if(!session){location.href='login.html';return}const {data:s,error}=await sb.from('test_series').select('id,title,description,price,launch_price,is_launch_offer,payment_link').eq('id',id).single();if(error)throw error;series=s;const {data:own}=await sb.from('purchases').select('id').eq('user_id',session.user.id).eq('test_series_id',id).maybeSingle();if(own){$('content').innerHTML='<h1>Already Unlocked</h1><p class="muted">This test series is already available to your account.</p><a class="upi" href="test-series.html">Go to Test Series →</a>';return}const offer=s.is_launch_offer&&s.launch_price!=null;const amount=offer?s.launch_price:s.price;$('content').innerHTML=`<h1>Buy ${esc(s.title)}</h1><p class="muted">${esc(s.description||'')}</p><div class="price">₹${Number(amount||0).toFixed(0)} ${offer?`<small style="font-size:12px;text-decoration:line-through;color:var(--gray)">₹${Number(s.price||0).toFixed(0)}</small>`:''}</div>${s.payment_link?`<a class="upi" href="${esc(s.payment_link)}" target="_blank" rel="noopener">Open UPI / Payment Link</a>`:'<p class="muted">Payment link has not been configured yet. Contact support.</p>'}<p class="muted">After payment, submit your UTR below. Payment is not considered successful just by opening the payment link.</p><label>Name</label><input id="name" value="${esc(session.user.user_metadata?.full_name||session.user.user_metadata?.name||'')}"><label>Mobile</label><input id="mobile" inputmode="numeric"><label>UTR / Payment ID</label><input id="utr" placeholder="Enter UTR / transaction ID"><label>Payment Date & Time</label><input id="ptime" type="datetime-local"><button class="btn" id="send">Submit Payment for Verification</button><div id="msg"></div>`;$('send').onclick=submit}catch(e){$('content').innerHTML=`<div class="msg err">${esc(e.message||'Unable to load')}</div>`}}
async function submit(){const name=$('name').value.trim(),mobile=$('mobile').value.trim(),utr=$('utr').value.trim(),ptime=$('ptime').value;if(!name||!mobile||!utr||!ptime){$('msg').className='msg err';$('msg').textContent='Please fill all payment fields.';return}const {data,error}=await sb.rpc('create_payment',{_test_series_id:series.id,_name:name,_mobile:mobile,_utr:utr,_payment_time:new Date(ptime).toISOString()});if(error){$('msg').className='msg err';$('msg').textContent=error.message;return}$('msg').className='msg ok';$('msg').textContent='Payment submitted. Admin verification is pending.';$('send').disabled=true}load();
</script></body></html>
