<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | Admin | Xtreme AG Apps</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/theme-controls.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--black,#FAF5EF);color:var(--white,#2C1A1D);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,94%);margin:auto}header{border-bottom:1px solid var(--border);background:var(--surface);padding:18px 0}.top{display:flex;justify-content:space-between;align-items:center}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin:20px 0}.row{display:grid;grid-template-columns:1.2fr 1fr .8fr .9fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.muted{color:var(--gray);font-size:11px;line-height:1.5}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.approve{background:#3e7c45;color:#fff}.reject{background:#a63a3a;color:#fff}.msg{padding:12px;border-radius:10px}.err{background:#f8e4e4;color:#9b3030}@media(max-width:800px){.row{grid-template-columns:1fr}.btn{width:100%}}
</style></head><body><header><div class="wrap top"><strong>💳 Payments & Sales</strong><a href="admin.html">← Admin</a></div></header><main class="wrap"><div id="msg"></div><div class="card"><h2>Payment Requests</h2><div id="list">Loading…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>'₹'+Number(n||0).toFixed(2);
async function load(){try{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}const {data:p}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(p?.is_admin!==true){throw new Error('Admin access required.')}const {data,error}=await sb.from('payments').select('id,user_id,test_series_id,name,mobile,amount,utr,payment_time,status,admin_note,created_at,test_series(title)').order('created_at',{ascending:false});if(error)throw error;const pending=(data||[]).filter(x=>x.status==='PENDING');$('list').innerHTML=pending.length?pending.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.mobile)}<br>${esc(x.user_id)}</div></div><div><strong>${esc(x.test_series?.title||'Series')}</strong><div class="muted">UTR: ${esc(x.utr)}<br>${new Date(x.payment_time).toLocaleString()}</div></div><div><strong>${money(x.amount)}</strong><div class="muted">PENDING</div></div><div class="muted">Submitted ${new Date(x.created_at).toLocaleString()}</div><div><button class="btn approve" onclick="act('${x.id}','approve')">Approve</button><button class="btn reject" onclick="act('${x.id}','reject')" style="margin-top:6px">Reject</button></div></div>`).join(''):'<p class="muted">No pending payments.</p>'}catch(e){$('msg').className='msg err';$('msg').textContent=e.message}}
async function act(id,type){const fn=type==='approve'?'approve_payment':'reject_payment';const {error}=await sb.rpc(fn,{_payment_id:id,_admin_note:type==='reject'?'Rejected by admin':null});if(error){$('msg').className='msg err';$('msg').textContent=error.message;return}load()}window.act=act;load();
</script></body></html>
