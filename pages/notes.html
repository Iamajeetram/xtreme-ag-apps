<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes | Xtreme ExamX</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/theme-controls.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#FAF5EF);color:var(--text,#2C1A1D);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,92%);margin:auto}header{position:sticky;top:0;z-index:5;background:var(--surface,#FFFBF7);border-bottom:1px solid var(--border)}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.nav a{color:inherit;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}main{padding:38px 0 70px}.hero h1{font-size:42px;margin:0 0 7px}.muted{color:var(--muted,#7A6666);font-size:12px;line-height:1.55}.card{background:var(--surface,#FFFBF7);border:1px solid var(--border);border-radius:20px;padding:20px}.thumb{width:100%;height:170px;object-fit:cover;border-radius:14px;background:var(--surface-2,#F7EBE1)}.badge{display:inline-block;margin-top:14px;padding:5px 9px;border:1px solid var(--border);border-radius:999px;font-size:9px;font-weight:900}.free{color:#287a45}.paid{color:#9b5b16}.title{font-size:20px;font-weight:950;margin:10px 0 5px}.price{font-weight:950;font-size:18px;margin:12px 0}.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:10px;padding:11px 15px;background:var(--primary,#D9531E);color:#fff;text-decoration:none;font-weight:900;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.locked{background:var(--surface-2,#F7EBE1);color:var(--text);border:1px solid var(--border)}.notice{padding:12px;border-radius:10px;background:var(--surface-2,#F7EBE1);margin:15px 0;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style></head><body><header><div class="wrap nav"><a href="dashboard.html"><strong>← Xtreme ExamX</strong></a><nav><a href="test-series.html">Test Series</a> &nbsp; <a href="profile.html">Profile</a></nav></div></header><main class="wrap"><section class="hero"><h1>Notes</h1><p class="muted">Handwritten and topic-wise PDFs. The first published Note is a free sample. Other Notes require purchase approval.</p></section><div id="notice" class="notice">Loading Notes...</div><section id="grid" class="grid"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function driveDownload(url){try{const u=new URL(url);let m=u.pathname.match(/\/file\/d\/([^/]+)/);if(m&&u.hostname.includes('drive.google.com'))return 'https://drive.google.com/uc?export=download&id='+encodeURIComponent(m[1]);const id=u.searchParams.get('id');if(id&&u.hostname.includes('drive.google.com'))return 'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id)}catch(e){}return url}
async function load(){const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session){location.replace('login.html');return}const {data,error}=await sb.from('user_notes').select('*').eq('is_published',true).order('display_order',{ascending:true}).order('created_at',{ascending:true});if(error)throw error;if(!data?.length){$('notice').textContent='No published Notes available yet.';return}$('notice').className='notice';$('notice').textContent='Free sample is open. Paid Notes unlock after admin approval.';$('grid').innerHTML=data.map(n=>{const access=!!n.has_access;return `<article class="card">${n.thumbnail_url?`<img class="thumb" src="${esc(n.thumbnail_url)}" alt="">`:''}<span class="badge ${n.is_free?'free':'paid'}">${n.is_free?'FREE SAMPLE':'PAID'}</span><div class="title">${esc(n.title)}</div><div class="muted">${esc(n.exam_name||'')} ${n.category?'• '+esc(n.category):''}</div><p class="muted">${esc(n.description||'')}</p>${n.is_free?'':'<div class="price">₹'+Number(n.price||0).toFixed(0)+'</div>'}<div class="actions">${access?`<a class="btn" target="_blank" rel="noopener" href="${esc(n.drive_url)}">Open PDF</a><a class="btn locked" href="${esc(driveDownload(n.drive_url))}" target="_blank" rel="noopener">Download PDF</a>`:`<a class="btn locked" href="buy-note.html?note=${encodeURIComponent(n.id)}">${'₹'+Number(n.price||0).toFixed(0)+' • Purchase Note'}</a>`}</div></article>`}).join('')}
load().catch(e=>{$('notice').textContent=e.message||'Unable to load Notes.'});
</script></body></html>
