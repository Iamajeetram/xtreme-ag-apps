<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Series | Xtreme ExamX</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/theme-controls.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--black,#FAF5EF);color:var(--white,#2C1A1D);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,92%);margin:auto}header{border-bottom:1px solid var(--border);background:var(--surface,#FFFBF7);position:sticky;top:0;z-index:5}.nav{height:68px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900}.logo span{color:var(--gold-light,#F2815B)}nav{display:flex;gap:14px}nav a{font-size:12px;color:var(--gray,#7A6666)}main{padding:48px 0 80px}.eyebrow{display:inline-block;border:1px solid var(--border);padding:6px 10px;border-radius:999px;font-size:9px;letter-spacing:1.5px;color:var(--gold,#D9531E);font-weight:800}.hero h1{font-size:clamp(32px,6vw,54px);margin:15px 0 8px}.hero p{color:var(--gray);max-width:650px}.notice,.card{background:var(--surface,#FFFBF7);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 12px 40px #0000000d}.notice{margin:25px 0}.notice.ok{border-color:#9ac59a}.notice.err{border-color:#e2a1a1;color:#9b3030}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card h2{margin:0 0 8px;font-size:20px}.muted{color:var(--gray);font-size:12px;line-height:1.6}.price{font-size:22px;font-weight:900;margin:15px 0}.old{text-decoration:line-through;color:var(--gray);font-size:12px;margin-left:6px}.badge{display:inline-block;font-size:9px;border:1px solid var(--border);padding:5px 8px;border-radius:999px;color:var(--gold,#D9531E)}.tests{margin-top:15px;border-top:1px solid var(--border);padding-top:15px}.test{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.test:last-child{border:0}.btn{border:0;background:linear-gradient(135deg,var(--gold,#D9531E),var(--gold-light,#F2815B));color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none;font-size:11px;white-space:nowrap}.btn.secondary{background:var(--surface-2,#F7EBE1);color:var(- </style></head><body><header><div class="wrap nav"><a class="logo" href="dashboard.html">Xtreme <span>ExamX</span></a><nav><a href="dashboard.html">Dashboard</a><a href="profile.html" id="profileLink" style="display:none">Profile</a></nav></div></header><main><div class="wrap"><div class="hero"><span class="eyebrow">XTREME EXAMX • TEST SERIES</span><h1>Choose your test series.</h1><p>Paid series unlock after payment approval. Admin accounts have free access for testing.</p></div><div id="notice" class="notice">Loading test series…</div><div id="grid" class="grid"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>'₹'+Number(n||0).toFixed(0);
async function load(){try{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}const {data:profile}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();const admin=profile?.is_admin===true;$('profileLink').style.display='inline';const {data:series,error}=await sb.from('test_series').select('id,title,slug,description,price,launch_price,is_launch_offer,is_published').order('created_at',{ascending:false});if(error)throw error;const visible=(series||[]).filter(s=>admin||s.is_published);if(!visible.length){$('notice').textContent='No published test series available yet.';$('grid').innerHTML='';return}const ids=visible.map(s=>s.id);const {data:purchases}=await sb.from('purchases').select('test_series_id').eq('user_id',session.user.id).in('test_series_id',ids);const owned=new Set((purchases||[]).map(x=>x.test_series_id));const {data:tests}=await sb.from('tests').select('id,test_series_id,title,description,time_limit_minutes,is_published,sort_order').in('test_series_id',ids).order('sort_order');$('notice').className='notice ok';$('notice').textContent=admin?'Admin mode: every series/test is available free, including drafts.':'Published series are shown below. Buy a paid series to unlock its tests.';$('grid').innerHTML=visible.map(s=>{const own=admin||owned.has(s.id)||Number(s.price||0)===0;const list=(tests||[]).filter(t=>t.test_series_id===s.id && (admin||t.is_published));const offer=s.is_launch_offer&&s.launch_price!=null;const price=offer?s.launch_price:s.price;return `<article class="card"><span class="badge">${s.is_published?'PUBLISHED':'DRAFT'}</span><h2>${esc(s.title)}</h2><p class="muted">${esc(s.description||'No description')}</p><div class="price">${Number(price||0)===0?'FREE':money(price)} ${offer?`<span class="old">${money(s.price)}</span>`:''}</div><div>${own?`<span class="badge">${admin?'ADMIN FREE':Number(s.price||0)===0?'FREE ACCESS':'UNLOCKED'}</span>`:`<a class="btn" href="buy-series.html?series=${encodeURIComponent(s.id)}">Buy Now</a>`}</div><div class="tests">${list.length?list.map(t=>`<div class="test"><div><strong>${esc(t.title)}</strong><div class="muted">${Number(t.time_limit_minutes||0)} min${t.description?' • '+esc(t.description):''}</div></div>${own?`<a class="btn" href="test-runner.html?test=${encodeURIComponent(t.id)}">Start Test</a>`:`<span class="muted">🔒 Locked</span>`}</div>`).join(''):`<div class="empty">No published tests in this series yet.</div>`}</div></article>`}).join('')}catch(e){console.error(e);$('notice').className='notice err';$('notice').textContent=e.message||'Unable to load test series.'}}
load();</script></body></html>
