async function load(){try{const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session){location.replace('login.html');return}const {data:p,error:pe}=await sb.from('profiles').select('display_name,is_admin').eq('id',session.user.id).maybeSingle();if(pe)throw pe;const admin=p?.is_admin===true;const {data:series,error}=await sb.from('test_series').select('id,title,slug,description,price,launch_price,is_launch_offer,is_published').order('created_at',{ascending:true});if(error)throw error;const visible=(series||[]).filter(s=>admin||s.is_published);if(!visible.length){$('notice').textContent='No published test series available yet.';return}const ids=visible.map(s=>s.id);const {data:purchases}=await sb.from('purchases').select('test_series_id').eq('user_id',session.user.id).in('test_series_id',ids);const owned=new Set((purchases||[]).map(x=>x.test_series_id));const {data:tests,error:te}=await sb.from('tests').select('id,test_series_id,title,description,time_limit_minutes,is_published,is_free,sort_order').in('test_series_id',ids).order('sort_order',{ascending:true});if(te)throw te;$('notice').className='notice ok';$('notice').textContent=admin?'Admin mode: all tests are available for testing.':'Open Test 1 first. Subscription is required for the remaining tests.';$('grid').innerHTML=visible.map(s=>{const allList=(tests||[]).filter(t=>t.test_series_id===s.id&&(admin||t.is_published));const own=admin||owned.has(s.id);const list=own?allList:allList.slice(0,1);return `<article class="series"><div class="series-head"><div><span class="badge">${s.is_published?'PUBLISHED':'DRAFT'}</span><h2>${esc(s.title)}</h2><p class="muted">${esc(s.description||'Exam-focused test series')}</p></div><div class="price">${own?'SUBSCRIBED':(Number(s.price||0)>0?'₹'+Number(s.is_launch_offer&&s.launch_price!=null?s.launch_price:s.price).toFixed(0):'FREE')}</div></div><div class="tests">${list.length?list.map((t,i)=>{const free=t.is_free===true||i===0;const unlocked=admin||free||own;return `<div class="test"><div class="test-icon">${free?'★':'▣'}</div><div><strong>${esc(t.title||`Test ${i+1}`)}</strong><div class="test-meta">${Number(t.time_limit_minutes||0)} min${t.description?' • '+esc(t.description):''} • ${free?'FREE':'SUBSCRIPTION REQUIRED'}</div></div><div class="actions">${unlocked?`<a class="btn" href="test-runner.html?test=${encodeURIComponent(t.id)}">Start Test →</a>`:`<a class="btn locked" href="buy-series.html?series=${encodeURIComponent(s.id)}">🔒 Subscribe to Unlock</a>`}<a class="btn locked" href="test-paper.html?test=${encodeURIComponent(t.id)}">PDF</a></div></div>`}).join(''):`<div class="empty">No tests available in this series yet.</div>`}</div>${!own&&allList.length>1?`<div class="hint">🔒 Tests 2–${allList.length} are hidden until your subscription is approved. <a href="buy-series.html?series=${encodeURIComponent(s.id)}" style="color:var(--gold);font-weight:900">Subscribe to unlock →</a></div>`:``}<div class="hint">Tip: Test-wise access is controlled by the test's <b>Free</b> setting. Subscription unlocks the remaining tests in this series.</div></article>`}).join('')}catch(e){console.error(e);$('notice').textContent=e.message||'Unable to load tests.'}}
