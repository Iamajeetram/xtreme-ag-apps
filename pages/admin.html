<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Console | Xtreme AG Apps</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#050b12;--panel:#0b1824;--text:#f4f8fb;--muted:#93a6b5;--cyan:#27e4ff;--blue:#4e7cff;--lime:#9dff54;--line:rgba(120,214,255,.17)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(39,228,255,.12),transparent 28%),#050b12;color:var(--text);font-family:"DM Sans",sans-serif}.wrap{width:min(1160px,92%);margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(5,11,18,.82);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:"Space Grotesk";font-weight:700}.brand span{color:var(--cyan)}button,input,select{font:inherit}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;padding:10px 13px;border-radius:12px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,#16cde9,#536cff);color:#031019;border:0}.danger{border-color:rgba(255,100,100,.2)}.hero{padding:50px 0 25px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:rgba(39,228,255,.08);color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:1px}.hero h1{font-family:"Space Grotesk";font-size:clamp(38px,6vw,65px);letter-spacing:-2px;margin:14px 0 8px}.hero p{color:var(--muted);max-width:680px;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(10,24,36,.8)}.stat b{display:block;font-family:"Space Grotesk";font-size:28px}.stat span{color:var(--muted);font-size:11px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{background:#091521;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}.toolbar input{flex:1;min-width:230px}.list{display:grid;gap:14px;padding-bottom:70px}.item{border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,rgba(12,28,42,.92),rgba(7,16,25,.9));padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.22)}.itemtop{display:flex;justify-content:space-between;gap:15px}.title{font-family:"Space Grotesk";font-size:20px;font-weight:700}.meta{color:var(--muted);font-size:12px;line-height:1.7;margin-top:6px}.pill{padding:6px 9px;border-radius:999px;background:rgba(157,255,84,.08);color:var(--lime);font-size:9px;font-weight:800;height:max-content}.message{margin:15px 0;white-space:pre-wrap;line-height:1.6;color:#d9e2e8}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.err{color:#ff9d9d}@media(max-width:620px){.stats{grid-template-columns:1fr}.itemtop{flex-direction:column}.hero{padding-top:35px}}</style></head><body><header class="top"><div class="wrap nav"><div class="brand">Xtreme <span>AG Apps</span> · Owner Console</div><div><button class="btn" id="refresh">↻ Refresh</button> <button class="btn danger" id="logout">Logout</button></div></div></header><main class="wrap"><section class="hero"><span class="badge">PRIVATE OWNER ACCESS</span><h1>Service Query Inbox</h1><p>Homepage se aane wali har requirement yahan secure owner session ke andar milegi. Search, filter, WhatsApp, call aur progress status ek hi jagah manage karo.</p></section><div class="stats"><div class="stat"><b id="total">0</b><span>Total queries</span></div><div class="stat"><b id="newCount">0</b><span>New</span></div><div class="stat"><b id="resolved">0</b><span>Resolved</span></div></div><div class="toolbar"><input id="search" type="search" placeholder="Search name, mobile, title, category…"><select id="filter"><option value="">All status</option><option value="new">New</option><option value="contacted">Contacted</option><option value="resolved">Resolved</option></select></div><div id="list" class="list"><div class="empty">Checking secure owner session…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9'),token=()=>sessionStorage.getItem('xag_owner_token')||'',list=document.getElementById('list'),search=document.getElementById('search'),filter=document.getElementById('filter');let rows=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(){const q=search.value.trim().toLowerCase(),st=filter.value,fs=rows.filter(x=>(!st||(x.status||'new')===st)&&(!q||[x.name,x.mobile,x.email,x.title,x.category,x.message].join(' ').toLowerCase().includes(q)));document.getElementById('total').textContent=rows.length;document.getElementById('newCount').textContent=rows.filter(x=>(x.status||'new')==='new').length;document.getElementById('resolved').textContent=rows.filter(x=>x.status==='resolved').length;if(!fs.length){list.innerHTML='<div class="empty">No service queries found.</div>';return}list.innerHTML=fs.map(x=>{const m=x.mobile||'',digits=m.replace(/[^0-9]/g,'');return `<article class="item"><div class="itemtop"><div><div class="title">${esc(x.title||'Service Query')}</div><div class="meta">👤 ${esc(x.name||'—')} · 📱 ${esc(m||'—')} · ${esc(x.email||'No email')}<br>📂 ${esc(x.category||'—')} · 🕒 ${esc(x.created_at?new Date(x.created_at).toLocaleString('en-IN'):'—')} · Contact: ${esc(x.preferred_contact||'WhatsApp')}</div></div><span class="pill">${esc((x.status||'new').toUpperCase())}</span></div><div class="message">${esc(x.message||'—')}</div><div class="actions">${m?`<a class="btn primary" href="tel:${esc(m)}">📞 Call</a><a class="btn" href="https://wa.me/${digits}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}<button class="btn" data-id="${esc(x.id)}" data-status="new">New</button><button class="btn" data-id="${esc(x.id)}" data-status="contacted">Contacted</button><button class="btn" data-id="${esc(x.id)}" data-status="resolved">Resolved</button></div></article>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status))}async function load(){list.innerHTML='<div class="empty">Loading secure inbox…</div>';const {data,error}=await sb.rpc('owner_get_service_queries',{p_token:token()});if(error){list.innerHTML='<div class="empty err">Session expired or SQL setup is incomplete. Please login again after running the final SQL.</div>';sessionStorage.clear();setTimeout(()=>location.href='../index.html',1000);return}rows=data||[];render()}async function setStatus(id,status){const {error}=await sb.rpc('owner_update_service_query',{p_token:token(),p_id:id,p_status:status});if(error){alert('Could not update status: '+error.message);return}load()}document.getElementById('refresh').onclick=load;search.oninput=render;filter.onchange=render;document.getElementById('logout').onclick=async()=>{if(token())await sb.rpc('owner_logout',{p_token:token()});sessionStorage.clear();location.href='../index.html'};if(!token()){location.replace('../index.html')}else{load()}</script></body></html>
