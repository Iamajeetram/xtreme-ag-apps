lay:block;font-size:30px;margin-top:5px}.tabs{display:flex;gap:8px;margin-bottom:13px}.tab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#c9d0df;padding:10px 15px;border-radius:999px;font-weight:900;cursor:pointer}.tab.active{background:linear-gradient(135deg,var(--a),#5f9dff);color:#fff;border-color:transparent}.panel{padding:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.chat-reply input{background:#080c18;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 12px;outline:none}.toolbar input{flex:1;min-width:220px}.list{display:grid;gap:9px}.row{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;padding:14px}.row-top{display:flex;justify-content:space-between;gap:15px;align-items:start}.name{font-weight:900}.meta{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}.msg{margin:11px 0;color:#dbe1ee;line-height:1.5;font-size:13px}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}.new{background:rgba(0,217,255,.12);color:#8eeeff}.contacted{background:rgba(255,202,95,.12);color:var(--warn)}.resolved{background:rgba(41,223,140,.12);color:var(--good)}.chat-layout{display:grid;grid-template-columns:330px 1fr;min-height:560px;overflow:hidden;border-radius:18px;border:1px solid var(--line)}.chat-list{border-right:1px solid var(--line);overflow:auto;background:rgba(0,0,0,.12)}.chat-item{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.chat-item.active{background:rgba(124,92,255,.13)}.chat-item strong{display:block}.chat-item small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{float:right;background:#ff4f77;color:#fff;border-radius:999px;min-width:22px;padding:3px 6px;text-align:center;font-size:10px;font-weight:900}.chat-window{display:flex;flex-direction:column;min-width:0}.chat-window-head{padding:15px 17px;border-bottom:1px solid var(--line)}.chat-messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px;min-height:420px}.bubble{max-width:76%;padding:10px 13px;border-radius:15px;font-size:13px;line-height:1.45}.bubble.visitor{align-self:flex-start;background:#182139}.bubble.owner{align-self:flex-end;background:linear-gradient(135deg,#6c50ed,#3c8dd7)}.chat-reply{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chat-reply input{flex:1}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#12192b;border:1px solid var(--line);padding:12px 16px;border-radius:999px;opacity:0;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.hero{display:block}.chat-layout{grid-template-columns:1fr}.chat-list{max-height:230px;border-right:0;border-bottom:1px solid var(--line)}.chat-window{min-height:500px}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.nav-actions .home{display:none}.row-top{display:block}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="../"><div class="mark">X</div><div>Xtreme <span>AG Apps</span></div></a><div class="nav-actions"><a class="btn home" href="../">Home</a><button class="btn" id="notifyBtn">🔔 Enable Alerts</button><button class="btn" id="logoutBtn">Logout</button></div></div></header><main class="wrap"><div class="hero"><div><div class="eyebrow">Private owner console</div><h1>Command Center</h1><p>Service enquiries and live customer conversations, in one place.</p></div><div class="eyebrow" id="sessionBadge">SECURE SESSION</div></div><div class="stats"><div class="stat"><small>Total Queries</small><strong id="sTotal">0</strong></div><div class="stat"><small>New Queries</small><strong id="sNew">0</strong></div><div class="stat"><small>Open Chats</small><strong id="sChats">0</strong></div><div class="stat"><small>Unread Chat</small><strong id="sUnread">0</strong></div></div><div class="tabs"><button class="tab active" data-tab="queries">📋 Queries</button><button class="tab" data-tab="chats">💬 Live Chats</button></div><section id="queriesTab" class="panel"><div class="toolbar"><input id="querySearch" placeholder="Search name, mobile, service or requirement"><select id="queryStatus"><option value="all">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="resolved">Resolved</option></select><button class="btn" id="refreshQueries">Refresh</button></div><div id="queryList" class="list"></div></section><section id="chatsTab" class="panel hidden"><div class="chat-layout"><aside class="chat-list" id="chatList"></aside><section class="chat-window"><div class="chat-window-head" id="chatHead">Select a conversation</div><div class="chat-messages" id="chatMessages"><div class="empty">Choose a chat from the left.</div></div><div class="chat-reply"><input id="replyInput" placeholder="Reply to customer…"><button class="btn primary" id="replyBtn">Send</button><button class <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://vbfjafblxnrfminbdlbb.supabase.co',KEY='sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9',sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:false}});const $=x=>document.getElementById(x);let token=localStorage.getItem('xag_owner_token'),queries=[],chats=[],activeChat=null,poll=null,chatPoll=null;function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function needToken(){if(!token){location.href='../';return false}return true}
async function rpc(fn,args){const r=await sb.rpc(fn,args);if(r.error&&/expired|session/i.test(r.error.message||'')){localStorage.removeItem('xag_owner_token');location.href='../';return null}if(r.error)throw r.error;return r.data}
async function loadQueries(){try{queries=await rpc('owner_list_queries',{p_token:token})||[];renderQueries()}catch(e){toast(e.message)}}function renderQueries(){const q=($('querySearch').value||'').toLowerCase(),st=$('queryStatus').value;const arr=queries.filter(x=>(st==='all'||x.status===st)&&[x.name,x.mobile,x.category,x.title,x.message].join(' ').toLowerCase().includes(q));$('queryList').innerHTML=arr.length?arr.map(x=>`<article class="row"><div class="row-top"><div><div class="name">${esc(x.name||'Visitor')} <span class="pill ${esc(x.status)}">${esc(x.status)}</span></div><div class="meta">${esc(x.category||'General')} • ${esc(x.mobile||'No mobile')} • ${new Date(x.created_at).toLocaleString()}</div></div><div class="row-actions"><button class="btn" onclick="statusQuery('${x.id}','contacted')">Contacted</button><button class="btn" onclick="statusQuery('${x.id}','resolved')">Resolved</button>${x.mobile?`<a class="btn" href="tel:${esc(x.mobile)}">📞 Call</a>`:''}${x.mobile?`<a class="btn" target="_blank" href="https://wa.me/91${esc(x.mobile).replace(/\D/g,'')}">💬 WhatsApp</a>`:''}</div></div><div class="msg"><strong>${esc(x.title||'Requirement')}</strong><br>${esc(x.message)}</div></article>`).join(''):'<div class="empty">No queries found.</div>';updateStats()}async function statusQuery(id,status){try{await rpc('owner_update_query_status',{p_token:token,p_id:id,p_status:status});await loadQueries();toast('Status updated ✓')}catch(e){toast(e.message)}}window.statusQuery=statusQuery;
async function loadChats(){try{chats=await rpc('owner_list_chats',{p_token:token})||[];renderChats();updateStats()}catch(e){toast(e.message)}}function renderChats(){const list=$('chatList');list.innerHTML=chats.length?chats.map(c=>`<div class="chat-item ${activeChat===c.id?'active':''}" onclick="openChat('${c.id}')">${c.unread_count?`<span class="unread">${c.unread_count}</span>`:''}<strong>${esc(c.visitor_name||'Visitor')}</strong><small>${esc(c.last_message||'No messages yet')}</small><small>${c.visitor_mobile?esc(c.visitor_mobile)+' • ':''}${c.last_message_at?new Date(c.last_message_at).toLocaleString():''}</small></div>`).join(''):'<div class="empty">No conversations yet.</div>'}async function openChat(id){activeChat=id;renderChats();const c=chats.find(x=>x.id===id);$('chatHead').innerHTML=`<strong>${esc(c?.visitor_name||'Visitor')}</strong><div style="color:var(--muted);font-size:12px">${esc(c?.visitor_mobile||'No mobile')}</div>`;await renderMessages();await loadChats()}window.openChat=openChat;async function renderMessages(){if(!activeChat)return;try{const m=await rpc('owner_get_chat',{p_token:token,p_conversation_id:activeChat})||[];$('chatMessages').innerHTML=m.length?m.map(x=>`<div class="bubble ${x.sender}">${esc(x.message)}</div>`).join(''):'<div class="empty">No messages.</div>';$('chatMessages').scrollTop=$('chatMessages').scrollHeight}catch(e){toast(e.message)}}$('replyBtn').onclick=async()=>{const m=$('replyInput').value.trim();if(!m||!activeChat)return;try{await rpc('owner_send_chat',{p_token:token,p_conversation_id:activeChat,p_message:m});$('replyInput').value='';await renderMessages();await loadChats()}catch(e){toast(e.message)}};$('replyInput').onkeydown=e=>{if(e.key==='Enter')$('replyBtn').click()};$('closeChatBtn').onclick=async()=>{if(!activeChat)return;try{await rpc('owner_close_chat',{p_token:token,p_conversation_id:activeChat});await loadChats();toast('Chat closed')}catch(e){toast(e.message)}};
function updateStats(){$('sTotal').textContent=queries.length;$('sNew').textContent=queries.filter(x=>x.status==='new').length;$('sChats').textContent=chats.filter(x=>x.status==='open').length;$('sUnread').textContent=chats.reduce((n,x)=>n+Number(x.unread_count||0),0)}$('querySearch').oninput=renderQueries;$('queryStatus').onchange=renderQueries;$('refreshQueries').onclick=loadQueries;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('queriesTab').classList.toggle('hidden',b.dataset.tab!=='queries');$('chatsTab').classList.toggle('hidden',b.dataset.tab!=='chats');if(b.dataset.tab==='chats')loadChats()});$('logoutBtn').onclick=async()=>{try{await rpc('owner_logout',{p_token:token})}catch{}localStorage.removeItem('xag_owner_token');location.href='../'};$('notifyBtn').onclick=async()=>{if(!('Notification'in window)){toast('Notifications are not supported here');return}const p=await Notification.requestPermission();if(p==='granted'){new Notification('Xtreme AG Apps',{body:'Owner alerts are enabled while this console is active.'});toast('Browser alerts enabled ✓')}else toast('Notification permission was denied')};
if(needToken()){loadQueries();loadChats();poll=setInterval(loadQueries,5000);chatPoll=setInterval(loadChats,2500)}
</script></body></html>
