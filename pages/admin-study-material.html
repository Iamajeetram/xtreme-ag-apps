<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes - Xtreme AG Apps</title><style>:root{--bg:#FAF5EF;--surface:#FFFBF7;--primary:#D9531E;--text:#2C1A1D;--muted:#7A6666;--border:#E6D8CC}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.container{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;color:var(--primary);text-decoration:none;font-size:20px}.nav a{margin-left:16px;color:var(--text);text-decoration:none}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 6px 20px rgba(44,26,29,.05)}h1{margin:25px 0 6px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700}input,textarea,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin-top:6px;background:#fff}input[type=checkbox]{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:#eee;color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--primary);color:#fff}.danger{background:#b42318;color:#fff}.item{border-top:1px solid var(--border);padding:16px 0;display:flex;justify-content:space-between;gap:15px}.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#eee}.ok{background:#dff5e5;color:#146c2e}.paid{background:#fff0e8;color:#a53d14}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column}}</style></head><body><header><div class="container nav"><a class="logo" href="../admin.html">Xtreme AG Apps</a><nav><a href="../admin.html">Admin</a><a href="../dashboard.html">Dashboard</a></nav></div></header><main class="container"><h1>📚 Notes</h1><p class="muted">Add PDF Notes using a Google Drive sharing link. The first published free note is allowed as the free sample; other notes are paid.</p><section class="card"><h2 id="formTitle">Add Note</h2><form id="form"><input id="id" type="hidden"><div class="grid"><label>Title *<input id="title" required></label><label>Slug<input id="slug" placeholder="ras-history-notes"></label><label>Exam<input id="exam_name" placeholder="RAS Prelims"></label><label>Category<input id="category" placeholder="Rajasthan History"></label><label>Price (₹)<input id="price" type="number" min="0" step="0.01" value="0"></label><label>Display Order<input id="display_order" type="number" value="0"></label><label class="full">Thumbnail URL<input id="thumbnail_url" type="url"></label><label class="full">Description<textarea id="description" rows="3"></textarea></label><label class="full">Google Drive PDF Sharing URL *<input id="drive_url" type="url" placeholder="https://drive.google.com/file/d/.../view" required></label><label><input id="is_free" type="checkbox"> Free Sample</label><label><input id="is_published" type="checkbox"> Published</label></div><div class="actions" style="margin-top:15px"><button class="btn primary" type="submit" id="saveBtn">Add Note</button><button class="btn" type="button" id="cancelBtn">Cancel Edit</button><a class="btn" href="../admin.html">Back</a></div><p id="msg" class="muted"></p></form></section><section class="card"><h2>Existing Notes</h2><div id="list" class="muted">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function driveUrl(v){return String(v||'').trim()}async function admin(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./login.html';return false}const {data:p,error}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(error||!p?.is_admin){document.body.innerHTML='<div class="container"><h1>Access Denied</h1></div>';return false}return true}function resetForm(){ $('form').reset();$('id').value='';$('price').value='0';$('formTitle').textContent='Add Note';$('saveBtn').textContent='Add Note';$('cancelBtn').classList.add('hidden');$('msg').textContent=''}function editNote(x){$('id').value=x.id;$('title').value=x.title||'';$('slug').value=x.slug||'';$('exam_name').value=x.exam_name||'';$('category').value=x.category||'';$('price').value=x.price??0;$('display_order').value=x.display_order??0;$('thumbnail_url').value=x.thumbnail_url||'';$('description').value=x.description||'';$('drive_url').value=x.drive_url||'';$('is_free').checked=!!x.is_free;$('is_published').checked=!!x.is_published;$('formTitle').textContent='Edit / Rename Note';$('saveBtn').textContent='Save Changes';$('cancelBtn').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}async function load(){const {data,error}=await sb.from('notes').select('*').order('display_order',{ascending:true}).order('created_at',{ascending:false});if(error){$('list').textContent=error.message;return}if(!data?.length){$('list').textContent='No notes added yet.';return}$('list').innerHTML=data.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc([x.exam_name,x.category].filter(Boolean).join(' • '))}</div><div style="margin-top:6px"><span class="status ${x.is_published?'ok':''}">${x.is_published?'Published':'Draft'}</span> <span class="status ${x.is_free?'ok':'paid'}">${x.is_free?'FREE SAMPLE':'PAID ₹'+Number(x.price||0)}</span></div></div><div class="actions"><button class="btn" onclick='editNote(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit / Rename</button><a class="btn" href="${esc(driveUrl(x.drive_url))}" target="_blank" rel="noopener">Open Drive</a><button class="btn danger" onclick="removeNote('${x.id}')">Delete</button></div></div>`).join('')}async function removeNote(id){if(!confirm('Delete this Note?'))return;const {error}=await sb.from('notes').delete().eq('id',id);if(error){alert(error.message);return}resetForm();load()}$('is_free').addEventListener('change',()=>{if($('is_free').checked)$('price').value='0'});$('form').addEventListener('submit',async e=>{e.preventDefault();const id=$('id').value||null;const free=$('is_free').checked;const price=Number($('price').value||0);if(free&&price!==0){$('msg').textContent='Free Sample price must be ₹0.';return}if(!free&&price<=0){$('msg').textContent='Paid Note price must be greater than ₹0.';return}const row={title:$('title').value.trim(),slug:$('slug').value.trim()||null,exam_name:$('exam_name').value.trim()||null,category:$('category').value.trim()||null,thumbnail_url:$('thumbnail_url').value.trim()||null,description:$('description').value.trim()||null,price,is_free:free,is_published:$('is_published').checked,display_order:Number($('display_order').value)||0,drive_url:driveUrl($('drive_url').value)};$('msg').textContent='Saving...';let result;if(id)result=await sb.from('notes').update(row).eq('id',id);else result=await sb.from('notes').insert(row);if(result.error){$('msg').textContent=result.error.message;return}resetForm();$('msg').textContent=id?'Updated successfully.':'Note added successfully.';load()});$('cancelBtn').addEventListener('click',resetForm);(async()=>{if(await admin()){resetForm();load()}})();</script></body></html>
